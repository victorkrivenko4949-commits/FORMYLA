<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FORMYLA{% endblock %}</title>
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16x16.png') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <!-- MathJax Configuration: Supports both LaTeX and plain text math -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true,
          processEnvironments: true
        },
        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
          ignoreHtmlClass: 'tex2jax_ignore',
          processHtmlClass: 'tex2jax_process'
        },
        startup: {
          pageReady: () => {
            return MathJax.startup.defaultPageReady().then(() => {
              console.log('✓ MathJax loaded and ready');
            });
          }
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header class="header">
        <a href="{{ url_for('index') }}" class="logo">
            <img src="/static/logo.png" alt="FORMYLA" height="40">
        </a>

        <nav class="nav">
            <a href="{{ url_for('index') }}">Разделы</a>
            <a href="{{ url_for('olympiads') }}">Олимпиады</a>
            <a href="{{ url_for('secrets') }}">Секреты олимпиадников</a>
            <a href="/practice">Написать олимпиаду</a>
            {% if current_user.is_authenticated %}
            <a href="#" onclick="document.getElementById('tutorBtn')?.click(); return false;" style="display: flex; align-items: center; gap: 6px;">
                💬 AI-Тьютор
            </a>
            {% endif %}
        </nav>
        
        <!-- Форма поиска -->
        <form action="/problems" method="get" style="margin-left: auto; display: flex; gap: 8px;">
            <input type="text" name="q" placeholder="🔍 Поиск по задачам..."
                   value="{{ request.args.get('q', '') }}"
                   style="padding: 8px 16px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; min-width: 250px; font-size: 14px;">
            <button type="submit" style="padding: 8px 20px; background: #3b82f6; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px;">
                Найти
            </button>
        </form>

        <!-- Авторизация -->
        <div style="display: flex; align-items: center; gap: 12px; margin-left: 16px;">
            {% if current_user.is_authenticated %}
                <!-- Авторизованный пользователь -->
                <a href="{{ url_for('profile') }}"
                   style="padding: 8px 16px; background: rgba(56, 189, 248, 0.1); color: var(--accent-2); text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 14px; border: 1px solid rgba(56, 189, 248, 0.3); transition: all 0.2s;"
                   onmouseover="this.style.background='rgba(56, 189, 248, 0.2)'"
                   onmouseout="this.style.background='rgba(56, 189, 248, 0.1)'">
                    👤 Профиль
                </a>
                
                <a href="{{ url_for('logout') }}"
                   style="padding: 8px 16px; background: rgba(255, 255, 255, 0.05); color: var(--text-muted); text-decoration: none; border-radius: 8px; font-size: 14px; border: 1px solid var(--border-soft); transition: all 0.2s;"
                   onmouseover="this.style.background='rgba(239, 68, 68, 0.1)'; this.style.color='#fca5a5'; this.style.borderColor='rgba(239, 68, 68, 0.3)'"
                   onmouseout="this.style.background='rgba(255, 255, 255, 0.05)'; this.style.color='var(--text-muted)'; this.style.borderColor='var(--border-soft)'">
                    Выйти
                </a>
            {% else %}
                <!-- Неавторизованный пользователь -->
                <a href="{{ url_for('login') }}"
                   style="padding: 10px 24px; background: linear-gradient(135deg, var(--accent-2) 0%, var(--accent-1) 100%); color: white; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 14px; transition: transform 0.2s; box-shadow: 0 2px 8px rgba(56, 189, 248, 0.3);"
                   onmouseover="this.style.transform='translateY(-2px)'"
                   onmouseout="this.style.transform='translateY(0)'">
                    🚀 Начать
                </a>
            {% endif %}
        </div>
    </header>

    <main class="main">
        {% block content %}{% endblock %}
    </main>
    <script>
MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)']],
    displayMath: [['\\[', '\\]']],
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    
    <script>
    async function checkAnswer(problemId) {
        const inputEl = document.getElementById(`user-answer-${problemId}`);
        const feedbackEl = document.getElementById(`feedback-${problemId}`);
        const formEl = document.getElementById(`answer-form-${problemId}`);
        const solutionEl = document.getElementById(`solution-container-${problemId}`);
        
        const userAnswer = inputEl.value.trim();
        
        if (!userAnswer) {
            feedbackEl.innerHTML = '<span style="color: #f59e0b;">⚠️ Введите ответ</span>';
            return;
        }
        
        feedbackEl.innerHTML = '<span style="color: #94a3b8;">Проверяем...</span>';
        
        try {
            const response = await fetch('/api/check_answer', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    problem_id: problemId,
                    user_answer: userAnswer
                })
            });
            
            const data = await response.json();
            
            if (data.correct) {
                feedbackEl.innerHTML = '<span style="color: #10b981; font-weight: 600;">✅ Верно! Отличная работа!</span>';
                
                // Показываем решение
                if (solutionEl) {
                    solutionEl.style.display = 'block';
                }
                
                // Через 1 секунду перезагружаем страницу для обновления статуса
                setTimeout(() => {
                    location.reload();
                }, 1500);
            } else {
                feedbackEl.innerHTML = `<span style="color: #ef4444; font-weight: 600;">❌ Неверно. Попробуйте еще раз!</span>`;
                inputEl.value = '';
                inputEl.focus();
            }
        } catch (error) {
            feedbackEl.innerHTML = '<span style="color: #ef4444;">Ошибка при проверке. Попробуйте еще раз.</span>';
            console.error('Error:', error);
        }
    }
    </script>
    
    <!-- AI Тьютор виджет -->
    {% include 'tutor_widget.html' %}
</body>
</html>
