{% extends "base.html" %}

{% block title %}{{ topic.title }} - FORMYLA{% endblock %}

{% block content %}
<div style="max-width: 900px; margin: 40px auto; padding: 0 20px;">
    
    <h1 style="font-size: 2.5em; color: var(--text-main); margin-bottom: 10px;">{{ topic.title }}</h1>
    
    <div style="background: var(--bg-card); backdrop-filter: blur(12px); padding: 30px; border-radius: var(--radius-lg); border: 1px solid var(--border-soft); margin-top: 30px;">
        <div style="color: var(--text-soft); line-height: 1.8;">
            {{ topic.content | safe }}
        </div>
    </div>
    
    <div style="text-align: center; margin-top: 40px;">
        <a href="{{ url_for('secrets') }}" style="padding: 12px 30px; background: rgba(255, 255, 255, 0.05); color: var(--text-soft); text-decoration: none; border-radius: var(--radius-sm); border: 1px solid var(--border-mid);">
            <- Все секреты
        </a>
    </div>

</div>
{% endblock %}
