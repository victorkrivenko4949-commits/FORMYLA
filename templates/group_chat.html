{% extends "base.html" %}
{% block content %}
<style>
.gc-wrap{max-width:900px;margin:24px auto;background:rgba(255,255,255,.02);border-radius:14px;display:flex;flex-direction:column;height:calc(100vh - 140px);overflow:hidden}
.gc-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.gc-av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#6c5ce7,#4aa8ff);display:flex;align-items:center;justify-content:center;font-size:1.4em}
.gc-head h2{margin:0;font-size:1.05em;color:#fff}
.gc-head .sub{color:#94a3b8;font-size:.85em;margin-top:2px}
.gc-actions{margin-left:auto;display:flex;gap:6px}
.gc-btn{background:transparent;border:none;color:#94a3b8;font-size:1.05em;cursor:pointer;padding:6px 10px;border-radius:8px}
.gc-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.gc-msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:8px}
.gc-msg{max-width:75%;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.05);color:#e2e8f0}
.gc-msg.mine{align-self:flex-end;background:linear-gradient(135deg,#6c5ce7,#4aa8ff);color:#fff}
.gc-msg .who{font-size:.78em;opacity:.7;margin-bottom:2px}
.gc-msg.mine .who{display:none}
.gc-msg .t{font-size:.72em;opacity:.6;margin-top:4px;text-align:right}
.gc-comp{display:flex;gap:8px;padding:14px;border-top:1px solid rgba(255,255,255,.08)}
/* CHAT_ATTACH_V1 — attachment preview + image messages in group chat */
.gc-attach-preview{display:flex;align-items:center;gap:10px;padding:6px 14px 0;font-size:.88em;color:#94a3b8}
.gc-attach-preview .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gc-attach-preview .cancel{cursor:pointer;color:#ef4444;font-size:1.2em;line-height:1;padding:0 4px}
.gc-attach-preview .cancel:hover{color:#ff6b6b}
.gc-msg .att-img{max-width:100%;max-height:320px;border-radius:8px;display:block;margin:4px 0;cursor:pointer}
.gc-msg .att-pdf{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;background:rgba(255,255,255,.08);border-radius:8px;margin:4px 0;font-size:.9em;color:#e2e8f0;text-decoration:none}
.gc-msg .att-pdf:hover{background:rgba(74,168,255,.18)}
.gc-msg .att-name{font-size:.8em;opacity:.7;margin-top:2px}
.gc-comp textarea{flex:1;resize:none;min-height:44px;max-height:120px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#fff;padding:10px 12px;font-size:.95em;outline:none}
.gc-comp button{background:linear-gradient(135deg,#6c5ce7,#4aa8ff);border:none;color:#fff;border-radius:10px;padding:0 18px;font-size:1.1em;cursor:pointer}
.gc-back{text-decoration:none;color:#94a3b8;font-size:1.4em;padding:4px 8px;border-radius:8px}
.gc-back:hover{background:rgba(255,255,255,.08);color:#fff}
.gc-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100}
.gc-modal{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:18px;width:90%;max-width:420px;max-height:70vh;display:flex;flex-direction:column;gap:10px}
.gc-modal h3{margin:0 0 6px;color:#fff}
.fr-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;color:#e2e8f0}
.fr-row:hover{background:rgba(74,168,255,.12)}
.fr-row .ok{margin-left:auto;color:#4caf50}
.gc-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.gc-modal button{background:rgba(255,255,255,.08);border:none;color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer}
.gc-modal button.primary{background:linear-gradient(135deg,#6c5ce7,#4aa8ff)}
.fr-list{overflow-y:auto;flex:1;min-height:200px}
[hidden]{display:none !important}

/* CHAT_GROUP_INFO_V1 — clickable header + info side-sheet */
.gc-head-info{cursor:pointer;transition:background .15s ease}
.gc-head-info:hover{background:rgba(255,255,255,.04)}
.gc-head-info:focus-visible{outline:2px solid #4aa8ff;outline-offset:-2px}
.gi-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:120;
  display:flex;justify-content:flex-end;
  backdrop-filter:blur(4px);
}
.gi-panel{
  width:420px;max-width:100%;height:100%;
  background:#171D33;border-left:1px solid rgba(255,255,255,.08);
  display:flex;flex-direction:column;
  box-shadow:-10px 0 30px rgba(0,0,0,.4);
  animation:gi-slide .22s ease;
}
@keyframes gi-slide{from{transform:translateX(100%)}to{transform:translateX(0)}}
.gi-head{
  display:flex;align-items:center;gap:10px;
  padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.08);
}
.gi-head h3{margin:0;color:#fff;font-size:1.05em;flex:1}
.gi-close{
  background:transparent;border:none;color:#94a3b8;
  font-size:1.6em;cursor:pointer;padding:2px 10px;border-radius:8px;line-height:1;
}
.gi-close:hover{background:rgba(255,255,255,.08);color:#fff}
.gi-body{flex:1;overflow-y:auto;padding:18px 16px}
.gi-hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0 18px}
.gi-hero-av{
  width:96px;height:96px;border-radius:50%;
  background:linear-gradient(135deg,#6c5ce7,#4aa8ff);
  display:flex;align-items:center;justify-content:center;
  font-size:3em;color:#fff;
}
.gi-hero-name{color:#fff;font-size:1.25em;font-weight:600;text-align:center;word-break:break-word}
.gi-hero-sub{color:#94a3b8;font-size:.88em;text-align:center}
.gi-section{margin-top:14px}
.gi-section-title{
  color:#94a3b8;font-size:.78em;text-transform:uppercase;letter-spacing:.5px;
  padding:0 4px 8px;font-weight:600;
}
.gi-row{
  display:flex;align-items:center;gap:12px;
  padding:10px 8px;border-radius:10px;
  color:#e2e8f0;font-size:.95em;
}
.gi-row .lbl{color:#94a3b8;flex:1}
.gi-row .val{color:#e2e8f0;font-weight:500;text-align:right;word-break:break-word}
.gi-row.action{cursor:pointer;transition:background .12s}
.gi-row.action:hover{background:rgba(74,168,255,.12)}
.gi-row.danger{color:#ef4444}
.gi-row.danger:hover{background:rgba(239,68,68,.12)}
.gi-row .ico{font-size:1.15em;width:22px;text-align:center}
.gi-mem-row{
  display:flex;align-items:center;gap:10px;
  padding:8px 8px;border-radius:10px;color:#e2e8f0;
  cursor:pointer;transition:background .12s;
}
.gi-mem-row:hover{background:rgba(74,168,255,.12)}
.gi-mem-av{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#6c5ce7,#4aa8ff);
  display:flex;align-items:center;justify-content:center;
  font-size:.9em;color:#fff;font-weight:600;overflow:hidden;
}
.gi-mem-av img{width:100%;height:100%;object-fit:cover}
.gi-mem-meta{flex:1;min-width:0}
.gi-mem-name{color:#fff;font-size:.95em;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gi-mem-sub{color:#94a3b8;font-size:.78em;margin-top:2px}
.gi-badge{
  font-size:.7em;padding:2px 8px;border-radius:10px;
  background:rgba(74,168,255,.18);color:#7dd3fc;font-weight:500;
  flex-shrink:0;
}
.gi-badge.owner{background:rgba(251,191,36,.18);color:#fbbf24}
.gi-loading{color:#94a3b8;text-align:center;padding:24px 0;font-size:.9em}
@media (max-width:520px){
  .gi-bg{background:rgba(0,0,0,.7)}
  .gi-panel{width:100%}
}

/* CHAT_EMOJI_V1 — composer emoji button + popup picker (group chat) */
.gc-emoji-btn{
  background:rgba(255,193,7,.14); color:#fbbf24;
  border:1px solid rgba(251,191,36,.35);
  border-radius:10px;
  width:44px; min-width:44px; height:44px;
  font-size:1.25em; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:background .12s ease, transform .12s ease;
}
.gc-emoji-btn:hover{ background:rgba(251,191,36,.28); transform:translateY(-1px); }
.gc-emoji-btn[aria-expanded="true"]{
  background:rgba(251,191,36,.32);
  box-shadow:0 0 0 2px rgba(251,191,36,.35);
}
.fm-emoji-pop{
  position:fixed; z-index:10001;
  width:340px; max-width:calc(100vw - 16px);
  height:380px; max-height:70vh;
  background:#1e293b;
  border:1px solid #334155;
  border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.55);
  display:flex; flex-direction:column;
  overflow:hidden;
  font-family:inherit;
  color:#e2e8f0;
}
.fm-emoji-pop[hidden]{ display:none; }
.fm-emoji-search-row{ padding:10px 12px 6px; border-bottom:1px solid rgba(255,255,255,.06); }
.fm-emoji-search{
  width:100%; box-sizing:border-box;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  border-radius:10px; color:#fff;
  padding:8px 12px; font-size:.92em; outline:none;
}
.fm-emoji-search:focus{ border-color:#4aa8ff; background:rgba(255,255,255,.09); }
.fm-emoji-body{ flex:1; overflow-y:auto; padding:8px 10px; }
.fm-emoji-section-title{
  font-size:.72em; text-transform:uppercase; letter-spacing:.5px;
  color:#94a3b8; padding:6px 4px 4px;
}
.fm-emoji-grid{ display:grid; grid-template-columns:repeat(8, minmax(0, 1fr)); gap:2px; }
.fm-emoji-btn{
  background:transparent; border:none; cursor:pointer;
  padding:4px; border-radius:8px;
  font-size:22px; line-height:1;
  display:flex; align-items:center; justify-content:center;
  transition:background .12s ease, transform .12s ease;
  color:inherit;
  font-family:'Apple Color Emoji','Segoe UI Emoji','Segoe UI Symbol','Noto Color Emoji',emoji,sans-serif;
}
.fm-emoji-btn:hover{ background:rgba(74,168,255,.22); transform:scale(1.15); }
.fm-emoji-empty{ color:#94a3b8; font-size:.88em; padding:18px 10px; text-align:center; }
.fm-emoji-tabs{
  display:flex; gap:2px; padding:6px;
  border-top:1px solid rgba(255,255,255,.06);
  background:rgba(15,23,42,.45);
  overflow-x:auto;
}
.fm-emoji-tab{
  background:transparent; border:none; cursor:pointer;
  padding:6px 8px; border-radius:8px;
  font-size:18px; line-height:1; color:#94a3b8;
  flex-shrink:0; transition:background .12s ease;
}
.fm-emoji-tab:hover{ background:rgba(74,168,255,.18); }
.fm-emoji-tab.active{ background:rgba(74,168,255,.28); color:#fff; }
@media (max-width:540px){
  .fm-emoji-pop{ width:calc(100vw - 16px); height:60vh; }
  .fm-emoji-grid{ grid-template-columns:repeat(7, minmax(0, 1fr)); }
  .fm-emoji-btn{ font-size:24px; padding:6px; }
}
</style>

<div class="gc-wrap">
  <div class="gc-head">
    <a href="/chat" class="gc-back" title="Назад">←</a>
    <!-- CHAT_GROUP_INFO_V1 — header is clickable to open group info panel -->
    <div class="gc-head-info" role="button" tabindex="0"
         style="display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:4px 8px;margin:-4px -4px;border-radius:8px"
         onclick="openGroupInfo()"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openGroupInfo();}"
         title="Информация о группе">
      <div class="gc-av">{{ group.avatar_emoji or '👥' }}</div>
      <div style="flex:1;min-width:0">
        <h2>{{ group.name }}</h2>
        <div class="sub" id="memCount">Загрузка…</div>
      </div>
    </div>
    <div class="gc-actions">
      <button class="gc-btn" type="button" title="Пригласить" onclick="openInv()">➕</button>
      <button class="gc-btn" type="button" title="Покинуть" onclick="leaveG()">🚪</button>
      {% if is_owner %}
      <button class="gc-btn" type="button" title="Удалить группу" onclick="deleteG()" style="color:#ef4444">🗑️</button>
      {% endif %}
    </div>
  </div>
  <div class="gc-msgs" id="msgs"></div>
  <div class="gc-comp">
    <button class="gc-emoji-btn" id="gcEmojiBtn" type="button" title="Эмодзи">😀</button>
    <textarea id="ta" placeholder="Сообщение в группу… (Enter — отправить)"
              onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); sendG();}"></textarea>
    <input type="file" id="gcFileInput" accept="image/*" hidden onchange="onGcAttachPicked(event)">
    <button onclick="sendG()">➤</button>
  </div>
  <div id="gcAttachPreview" class="gc-attach-preview" hidden>
    <span class="name" id="gcAttachName"></span>
    <span class="cancel" onclick="cancelGcAttach()" title="Отменить">✕</span>
  </div>
</div>

<div id="invMod" class="gc-modal-bg" hidden onclick="if(event.target===this) closeInv()">
  <div class="gc-modal">
    <h3>Пригласить друга</h3>
    <div class="fr-list" id="invList">Загрузка…</div>
    <div class="gc-foot">
      <button onclick="closeInv()">Закрыть</button>
    </div>
  </div>
</div>

<!-- CHAT_GROUP_INFO_V1 — group info side-sheet -->
<div id="giPanel" class="gi-bg" hidden onclick="if(event.target===this) closeGroupInfo()">
  <aside class="gi-panel" role="dialog" aria-label="Информация о группе">
    <div class="gi-head">
      <h3>Информация о группе</h3>
      <button type="button" class="gi-close" title="Закрыть" onclick="closeGroupInfo()">×</button>
    </div>
    <div class="gi-body" id="giBody">
      <div class="gi-loading">Загрузка…</div>
    </div>
  </aside>
</div>

<script>
const GID = {{ group.id }};
const MEID = {{ current_user.id }};
const IS_OWNER = {{ 'true' if is_owner else 'false' }};

function fmtT(iso){
  if(!iso) return '';
  try{
    const d = new Date(iso);
    return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  }catch(_){return ''}
}
function esc(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadM(){
  try{
    const r = await fetch('/api/groups/' + GID + '/messages');
    if(!r.ok) return;
    const d = await r.json();
    const box = document.getElementById('msgs');
    box.innerHTML = '';
    for(const m of (d.messages || [])){
      const div = document.createElement('div');
      div.className = 'gc-msg' + (m.mine ? ' mine' : '');
      const who = m.mine ? '' : '<div class="who">' + esc(m.sender_name) + '</div>';
      // CHAT_ATTACH_V1 — render attachment messages
      let attachHtml = '';
      if (m.kind === 'attachment' && m.attachment_url){
        if (m.attachment_kind === 'image'){
          attachHtml = '<img class="att-img" src="' + esc(m.attachment_url) + '" onclick="window.open(this.src)" alt="">';
        } else if (m.attachment_kind === 'pdf'){
          attachHtml = '<a class="att-pdf" href="' + esc(m.attachment_url) + '" target="_blank">📄 ' + esc(m.attachment_name || 'PDF') + '</a>';
        }
      }
      const bodyHtml = m.body ? esc(m.body) : '';
      const bodyBlock = bodyHtml ? '<div>' + bodyHtml + '</div>' : '';
      div.innerHTML = who + attachHtml + bodyBlock + '<div class="t">' + fmtT(m.created_at) + '</div>';
      box.appendChild(div);
    }
    box.scrollTop = box.scrollHeight;
  }catch(e){ console.error(e); }
}

async function loadMem(){
  try{
    const r = await fetch('/api/groups/' + GID + '/members');
    if(!r.ok) return;
    const d = await r.json();
    const c = document.getElementById('memCount');
    if(c) c.textContent = (d.members||[]).length + ' участников';
  }catch(_){}
}

async function sendG(){
  const ta = document.getElementById('ta');
  const hasAttach = !!window.gcPendingAttachment;
  const body = (ta.value || '').trim();
  if(!body && !hasAttach) return;
  try{
    const payload = {body: body};
    if(hasAttach){
      payload.kind = 'attachment';
      payload.attachment = window.gcPendingAttachment;
    }
    const r = await fetch('/api/groups/' + GID + '/send', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    if(!r.ok){
      const e = await r.json().catch(()=>({}));
      alert(e.error || 'Ошибка');
      return;
    }
    ta.value = '';
    cancelGcAttach();
    await loadM();
  }catch(e){ console.error(e); alert('Ошибка соединения'); }
}

async function leaveG(){
  if(!confirm('Точно покинуть группу?')) return;
  try{
    const r = await fetch('/api/groups/' + GID + '/leave', {method:'POST'});
    if(r.ok){ window.location.href = '/chat'; }
  }catch(_){}
}

async function openInv(){
  document.getElementById('invMod').hidden = false;
  try{
    const [memR, conR] = await Promise.all([
      fetch('/api/groups/' + GID + '/members'),
      fetch('/api/chat/conversations')
    ]);
    const memD = memR.ok ? await memR.json() : {members:[]};
    const conD = conR.ok ? await conR.json() : {conversations:[]};
    const memIds = new Set((memD.members||[]).map(m => m.id));
    const candidates = (conD.conversations||[])
      .map(c => c.friend)
      .filter(f => f && !memIds.has(f.id));
    const list = document.getElementById('invList');
    if(!candidates.length){
      list.innerHTML = '<div style="padding:20px;text-align:center;color:#94a3b8">Нет друзей, которых можно пригласить</div>';
      return;
    }
    list.innerHTML = candidates.map(f =>
      '<div class="fr-row" onclick="inviteFr(' + f.id + ', this)">'
      + '<div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#6c5ce7,#4aa8ff);display:flex;align-items:center;justify-content:center">'
      + esc((f.name||f.nickname||'?')[0].toUpperCase()) + '</div>'
      + '<div>' + esc(f.name||f.nickname||'?') + '</div>'
      + '<span class="ok" style="display:none">✓</span>'
      + '</div>'
    ).join('');
  }catch(e){ console.error(e); }
}

function closeInv(){
  document.getElementById('invMod').hidden = true;
  loadMem();
}

async function inviteFr(uid, row){
  try{
    const r = await fetch('/api/groups/' + GID + '/invite', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({user_id: uid})
    });
    if(r.ok){
      const ok = row.querySelector('.ok');
      if(ok) ok.style.display = '';
      row.style.opacity = '0.5';
      row.style.pointerEvents = 'none';
    } else {
      const e = await r.json().catch(()=>({}));
      alert(e.error || 'Ошибка');
    }
  }catch(_){ alert('Ошибка соединения'); }
}

// CHAT_GROUP_INFO_V1 — group info panel
function fmtDate(iso){
  if(!iso) return '—';
  try{
    const d = new Date(iso);
    return d.toLocaleDateString('ru-RU', {day:'2-digit', month:'long', year:'numeric'});
  }catch(_){ return '—'; }
}

function escAttr(s){ return esc(s); }

async function openGroupInfo(){
  const panel = document.getElementById('giPanel');
  const body  = document.getElementById('giBody');
  panel.hidden = false;
  body.innerHTML = '<div class="gi-loading">Загрузка…</div>';
  try{
    const r = await fetch('/api/groups/' + GID + '/info');
    if(!r.ok){
      let extra = '';
      try { const ed = await r.json(); if(ed && ed.error) extra = ' — ' + ed.error; }
      catch(_) {}
      body.innerHTML = '<div class="gi-loading">Не удалось загрузить информацию (HTTP ' + r.status + ')' + extra + '</div>';
      return;
    }
    const d = await r.json();
    const g = d.group || {};
    const members = d.members || [];
    const ownerBadge = (m) => m.is_owner
      ? '<span class="gi-badge owner">Владелец</span>'
      : (m.role === 'admin' ? '<span class="gi-badge">Админ</span>' : '');
    const memberHtml = members.map(m => {
      const av = m.avatar_url
        ? '<img src="' + escAttr(m.avatar_url) + '" alt="">'
        : esc((m.name || '?')[0].toUpperCase());
      const nameLabel = m.is_me ? esc(m.name) + ' (Вы)' : esc(m.name);
      const sub = (m.nickname && m.nickname !== m.name)
        ? '@' + esc(m.nickname) + ' · Уровень ' + (m.level || 1)
        : 'Уровень ' + (m.level || 1) + ' · ' + (m.xp || 0) + ' XP';
      const onclick = m.is_me
        ? 'window.location.href=\'/profile\''
        : 'window.location.href=\'/user/' + m.id + '\'';
      return ''
        + '<div class="gi-mem-row" onclick="' + onclick + '">'
        +   '<div class="gi-mem-av">' + av + '</div>'
        +   '<div class="gi-mem-meta">'
        +     '<div class="gi-mem-name">' + nameLabel + '</div>'
        +     '<div class="gi-mem-sub">' + sub + '</div>'
        +   '</div>'
        +   ownerBadge(m)
        + '</div>';
    }).join('');
    body.innerHTML = ''
      + '<div class="gi-hero">'
      +   '<div class="gi-hero-av">' + esc(g.avatar_emoji || '👥') + '</div>'
      +   '<div class="gi-hero-name">' + esc(g.name || 'Группа') + '</div>'
      +   '<div class="gi-hero-sub">Группа · ' + (g.member_count || 0) + ' участников</div>'
      + '</div>'
      + '<div class="gi-section">'
      +   '<div class="gi-section-title">О группе</div>'
      +   '<div class="gi-row"><span class="ico">👑</span><span class="lbl">Владелец</span><span class="val">' + esc(g.owner_name || '—') + '</span></div>'
      +   '<div class="gi-row"><span class="ico">📅</span><span class="lbl">Создана</span><span class="val">' + fmtDate(g.created_at) + '</span></div>'
      +   '<div class="gi-row"><span class="ico">💬</span><span class="lbl">Сообщений</span><span class="val">' + (g.message_count || 0) + '</span></div>'
      +   '<div class="gi-row"><span class="ico">#</span><span class="lbl">ID группы</span><span class="val">' + g.id + '</span></div>'
      + '</div>'
      + '<div class="gi-section">'
      +   '<div class="gi-section-title">' + (g.member_count || members.length) + ' участников</div>'
      +   memberHtml
      + '</div>'
      + '<div class="gi-section">'
      +   '<div class="gi-row action" onclick="closeGroupInfo(); openInv();"><span class="ico">➕</span><span class="lbl">Пригласить друга</span></div>'
      +   '<div class="gi-row action danger" onclick="closeGroupInfo(); leaveG();"><span class="ico">🚪</span><span class="lbl">Покинуть группу</span></div>'
      +   (IS_OWNER ? '<div class="gi-row action danger" onclick="deleteGFromInfo()"><span class="ico">🗑</span><span class="lbl">Удалить группу</span></div>' : '')
      + '</div>';
  }catch(e){
    console.error(e);
    body.innerHTML = '<div class="gi-loading">Ошибка соединения</div>';
  }
}

function closeGroupInfo(){
  const panel = document.getElementById('giPanel');
  if(panel) panel.hidden = true;
}

async function deleteGFromInfo(){
  if(!IS_OWNER) return;
  if(!confirm('Точно удалить группу? Это действие необратимо — все сообщения и участники будут удалены.')) return;
  try{
    const r = await fetch('/api/groups/' + GID, {method:'DELETE'});
    if(r.ok){
      window.location.href = '/chat';
      return;
    }
    let msg = 'Ошибка удаления (HTTP ' + r.status + ')';
    try { const ed = await r.json(); if(ed && ed.error) msg = ed.error; } catch(_){}
    alert(msg);
  }catch(e){ console.error(e); alert('Ошибка соединения'); }
}

// CHAT_ATTACH_V1 — attachment upload / paste support for group chat
let gcPendingAttachment = null;

async function uploadGcAttachment(file){
  const MAX_BYTES = 5 * 1024 * 1024;
  const allowed = ['image/jpeg','image/png','image/webp','image/gif','application/pdf'];
  if(!allowed.includes(file.type)){ alert('Разрешены только JPG, PNG, WebP, GIF и PDF'); return null; }
  if(file.size > MAX_BYTES){ alert('Файл слишком большой (макс. 5 МБ)'); return null; }
  const fd = new FormData();
  fd.append('file', file);
  try{
    const r = await fetch('/api/groups/' + GID + '/upload', {method:'POST', body:fd});
    const d = await r.json();
    if(!r.ok || !d.success){ alert(d.error || 'Ошибка загрузки'); return null; }
    gcPendingAttachment = d.attachment;
    document.getElementById('gcAttachName').textContent = d.attachment.name || 'Файл';
    document.getElementById('gcAttachPreview').hidden = false;
    return d.attachment;
  }catch(e){ console.error(e); alert('Ошибка соединения при загрузке'); return null; }
}

function onGcAttachPicked(ev){
  const file = ev.target.files && ev.target.files[0];
  if(file) uploadGcAttachment(file);
  ev.target.value = '';
}

function cancelGcAttach(){
  gcPendingAttachment = null;
  document.getElementById('gcAttachPreview').hidden = true;
  document.getElementById('gcAttachName').textContent = '';
}

function initGcPasteHandler(){
  const ta = document.getElementById('ta');
  if(!ta) return;
  ta.addEventListener('paste', function(e){
    const items = e.clipboardData && e.clipboardData.items;
    if(!items) return;
    for(let i=0; i<items.length; i++){
      if(items[i].kind === 'file'){
        const file = items[i].getAsFile();
        if(file){ e.preventDefault(); uploadGcAttachment(file); }
        return;
      }
    }
  });
}

document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){
    const p = document.getElementById('giPanel');
    if(p && !p.hidden){ closeGroupInfo(); }
  }
});

document.addEventListener('DOMContentLoaded', () => {
  loadM();
  loadMem();
  setInterval(loadM, 8000);
  // CHAT_EMOJI_V1 — wire composer 😀 button
  if (window.EmojiPicker){
    const btn = document.getElementById('gcEmojiBtn');
    const ta  = document.getElementById('ta');
    if (btn && ta) window.EmojiPicker.attach({ button: btn, target: ta, anchor: btn });
  }
  // CHAT_ATTACH_V1 — wire paste handler for Ctrl+V
  initGcPasteHandler();
});
</script>
<script src="{{ url_for('static', filename='js/emoji_picker.js') }}" defer></script>
