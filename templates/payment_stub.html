{% extends "base.html" %}
{% block title %}Оплата — FORMYLA{% endblock %}

{% block content %}
<div class="paystub-page">
    <section class="paystub-inner">
        <div class="paystub-card glass">
            <h1 class="paystub-title">Оплата скоро появится</h1>
            <div class="paystub-package-info">
                <div class="paystub-amount">{{ package.amount }} чертежей</div>
                <div class="paystub-price">0 руб.</div>
            </div>
            <p class="paystub-text">
                Сейчас всё доступно бесплатно. Оплата появится позже — мы сообщим,
                как только платёжная система заработает.
            </p>
            <form id="notifyForm" class="paystub-form" onsubmit="return handleNotify(event)">
                <label for="notifyEmail" class="paystub-label">Сообщить мне, когда заработает:</label>
                <div class="paystub-row">
                    <input type="email" id="notifyEmail" placeholder="your@email.com" required class="paystub-input">
                    <button type="submit" class="paystub-btn">Отправить</button>
                </div>
                <div id="notifyResult" class="paystub-result" hidden></div>
            </form>
            <a href="/pricing" class="paystub-back"><- Назад к пакетам</a>
        </div>
    </section>
</div>

<style>
    .glass {
        background: var(--surface);
        border: 1px solid var(--border);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-radius: 14px;
    }
    .paystub-page {
        max-width: 600px; margin: 0 auto; padding: 60px 16px 80px; color: var(--text);
    }
    .paystub-card { padding: 40px 32px; text-align: center; }
    .paystub-title { font-size: 26px; font-weight: 700; margin: 0 0 24px; color: var(--text); }
    .paystub-package-info {
        display: inline-flex; gap: 16px; align-items: baseline;
        padding: 16px 28px; background: rgba(76,125,255,0.08);
        border: 1px solid rgba(76,125,255,0.18); border-radius: 12px; margin-bottom: 24px;
    }
    .paystub-amount { font-size: 22px; font-weight: 700; color: var(--text); }
    .paystub-price { font-size: 22px; font-weight: 700; color: var(--accent); }
    .paystub-text { color: var(--muted); font-size: 15px; line-height: 1.6; margin: 0 0 28px; }
    .paystub-form { text-align: left; }
    .paystub-label { display: block; font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 10px; }
    .paystub-row { display: flex; gap: 10px; }
    .paystub-input {
        flex: 1; padding: 10px 14px; background: var(--bg); border: 1px solid var(--border);
        border-radius: 10px; color: var(--text); font-size: 15px;
    }
    .paystub-input:focus { outline: none; border-color: var(--accent); }
    .paystub-btn {
        padding: 10px 24px; background: var(--accent); color: #fff; border: none;
        border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .paystub-btn:hover { background: var(--accent-hi); }
    .paystub-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .paystub-result { margin-top: 12px; font-size: 14px; }
    .paystub-result--ok { color: var(--ok); }
    .paystub-result--err { color: var(--bad); }
    .paystub-back {
        display: inline-block; margin-top: 24px; color: var(--muted); text-decoration: none; font-size: 14px;
    }
    .paystub-back:hover { color: var(--text); }
    @media (max-width: 600px) {
        .paystub-page { padding: 30px 12px 100px; }
        .paystub-card { padding: 28px 20px; }
        .paystub-row { flex-direction: column; }
    }
</style>

<script>
function handleNotify(e) {
    e.preventDefault();
    const email = document.getElementById('notifyEmail').value.trim();
    const btn = e.target.querySelector('button[type=submit]');
    const result = document.getElementById('notifyResult');
    if (!email) return false;

    btn.disabled = true;
    result.hidden = false;
    result.className = 'paystub-result';
    result.textContent = 'Отправляем...';

    fetch('/api/figures/subscribe-email', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: email})
    })
    .then(r => r.json())
    .then(data => {
        if (data.ok) {
            result.className = 'paystub-result paystub-result--ok';
            result.textContent = data.message;
            document.getElementById('notifyEmail').value = '';
        } else {
            result.className = 'paystub-result paystub-result--err';
            result.textContent = data.error || 'Ошибка';
        }
    })
    .catch(() => {
        result.className = 'paystub-result paystub-result--err';
        result.textContent = 'Ошибка соединения';
    })
    .finally(() => { btn.disabled = false; });

    return false;
}
</script>
{% endblock %}
