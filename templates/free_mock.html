{% extends "base.html" %}

{% block title %}Бесплатный пробник - FORMYLA{% endblock %}

{% block content %}
<div class="container" style="max-width: 900px; margin: 40px auto; padding: 0 20px;">
    
    <div style="text-align: center; margin-bottom: 40px;">
        <h1 style="font-size: 2.5em; color: var(--text-main); margin-bottom: 10px;">
            📝 Бесплатный пробник
        </h1>
        <p style="font-size: 1.1em; color: var(--text-soft);">
            5 задач • Уровень 1-3 • Без проверки решений
        </p>
    </div>

    <form method="POST" action="{{ url_for('free_mock_submit') }}">
        
        {% for task in tasks %}
        <div style="background: var(--bg-card); backdrop-filter: blur(12px); padding: 30px; border-radius: var(--radius-lg); border: 1px solid var(--border-soft); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); margin-bottom: 30px;">
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="color: var(--accent-2); margin: 0;">Задача {{ loop.index }}</h3>
                <span style="padding: 6px 12px; background: rgba(56, 189, 248, 0.1); color: var(--accent-2); border-radius: 8px; font-size: 14px; font-weight: 600;">
                    Уровень {{ task.difficulty }}
                </span>
            </div>
            
            <div style="color: var(--text-soft); line-height: 1.8; margin-bottom: 25px; white-space: pre-wrap;">
                {{ task.text }}
            </div>
            
            <div style="margin-top: 20px;">
                <label style="display: block; color: var(--text-muted); margin-bottom: 10px; font-weight: 500;">
                    Ваш ответ:
                </label>
                <input type="text" 
                       name="answer_{{ loop.index }}" 
                       required
                       placeholder="Введите ответ"
                       style="width: 100%; padding: 15px; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-mid); border-radius: var(--radius-sm); color: var(--text-main); font-size: 16px; caret-color: var(--accent-2);"
                       onfocus="this.style.borderColor='var(--accent-2)'"
                       onblur="this.style.borderColor='var(--border-mid)'">
            </div>
            
        </div>
        {% endfor %}
        
        <div style="text-align: center; margin-top: 40px;">
            <button type="submit" 
                    style="padding: 18px 50px; background: linear-gradient(135deg, var(--accent-2) 0%, var(--accent-1) 100%); color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4); transition: transform 0.3s;"
                    onmouseover="this.style.transform='translateY(-2px)'"
                    onmouseout="this.style.transform='translateY(0)'">
                ✅ Проверить ответы
            </button>
        </div>
        
    </form>
    
</div>
{% endblock %}
