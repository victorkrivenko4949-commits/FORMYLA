{% extends "base.html" %}

{% block title %}Бесплатный пробник - FORMYLA{% endblock %}

{% block content %}
<div class="container" style="max-width: 900px; margin: 40px auto; padding: 0 20px;">
    
    <!-- Заголовок -->
    <div style="text-align: center; margin-bottom: 40px;">
        <h1 style="font-size: 2.5em; color: var(--text-main); margin-bottom: 10px;">
            📝 Бесплатный пробник
        </h1>
        <p style="font-size: 1.1em; color: var(--text-soft);">
            25 задач • Пошаговая генерация • Без ожидания
        </p>
    </div>

    <!-- Контейнер для динамического контента -->
    <div id="mock-container">
        
        <!-- Форма настроек (показывается в начале) -->
        <div id="setup-form" style="background: var(--bg-card); backdrop-filter: blur(12px); padding: 40px; border-radius: var(--radius-lg); border: 1px solid var(--border-soft); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);">
            
            <h2 style="color: var(--accent-2); margin-bottom: 30px; text-align: center;">⚙️ Настройки теста</h2>
            
            <div style="margin-bottom: 25px;">
                <label style="display: block; color: var(--text-muted); margin-bottom: 10px; font-weight: 500;">
                    Класс:
                </label>
                <select id="class-select" 
                        style="width: 100%; padding: 15px; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-mid); border-radius: var(--radius-sm); color: var(--text-main); font-size: 16px;">
                    <option value="5">5 класс</option>
                    <option value="6">6 класс</option>
                    <option value="7">7 класс</option>
                    <option value="8">8 класс</option>
                    <option value="9">9 класс</option>
                    <option value="10">10 класс</option>
                    <option value="11">11 класс</option>
                </select>
            </div>
            
            <div style="margin-bottom: 30px;">
                <label style="display: block; color: var(--text-muted); margin-bottom: 10px; font-weight: 500;">
                    Уровень сложности:
                </label>
                <select id="difficulty-select" 
                        style="width: 100%; padding: 15px; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-mid); border-radius: var(--radius-sm); color: var(--text-main); font-size: 16px;">
                    <option value="1">1 - Базовый</option>
                    <option value="2">2 - Легкий</option>
                    <option value="3" selected>3 - Средний</option>
                    <option value="4">4 - Сложный</option>
                    <option value="5">5 - Олимпиадный</option>
                </select>
            </div>
            
            <div style="text-align: center;">
                <button onclick="startTest()" 
                        style="padding: 18px 50px; background: linear-gradient(135deg, var(--accent-2) 0%, var(--accent-1) 100%); color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4); transition: transform 0.3s;"
                        onmouseover="this.style.transform='translateY(-2px)'"
                        onmouseout="this.style.transform='translateY(0)'">
                    🚀 Начать тест
                </button>
            </div>
            
        </div>
        
        <!-- Блок с задачей (скрыт по умолчанию) -->
        <div id="task-block" style="display: none;">
            <!-- Прогресс-бар -->
            <div style="background: var(--bg-card); padding: 20px; border-radius: var(--radius-lg); border: 1px solid var(--border-soft); margin-bottom: 30px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <span style="color: var(--text-soft); font-weight: 600;">Прогресс:</span>
                    <span id="progress-text" style="color: var(--accent-2); font-weight: 600;">Задача 1/25</span>
                </div>
                <div style="width: 100%; height: 8px; background: rgba(15, 23, 42, 0.6); border-radius: 4px; overflow: hidden;">
                    <div id="progress-bar" style="width: 4%; height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent-1)); transition: width 0.5s;"></div>
                </div>
            </div>
            
            <!-- Контейнер для текущей задачи -->
            <div id="current-task-container"></div>
            
            <!-- Кнопка навигации -->
            <div style="text-align: center; margin-top: 40px;">
                <button id="next-button" onclick="nextTask()" 
                        style="padding: 18px 50px; background: linear-gradient(135deg, var(--accent-2) 0%, var(--accent-1) 100%); color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4); transition: transform 0.3s;"
                        onmouseover="this.style.transform='translateY(-2px)'"
                        onmouseout="this.style.transform='translateY(0)'">
                    Далее →
                </button>
            </div>
        </div>
        
        <!-- Спиннер загрузки -->
        <div id="loading-spinner" style="display: none; text-align: center; padding: 60px;">
            <div style="display: inline-block; width: 60px; height: 60px; border: 6px solid rgba(56, 189, 248, 0.2); border-top-color: var(--accent-2); border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <p id="loading-text" style="color: var(--text-soft); margin-top: 20px; font-size: 18px;">Генерация задачи...</p>
        </div>
        
        <!-- Результаты (скрыты по умолчанию) -->
        <div id="results-block" style="display: none;"></div>
        
    </div>
    
</div>

<style>
@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>

<script>
// Глобальные переменные для архитектуры с очередью
let currentTaskNum = 1;
let tasksQueue = {};  // Очередь предзагруженных задач
let userAnswers = [];
let allTasks = [];
let classLevel = '';
let difficulty = '';
let previousTopics = [];
let isFetchingNext = false;
let preloadedTasks = {};  // Для сохранения предзагруженных задач

// МАССИВ ТЕМ ДЛЯ РОТАЦИИ (5 тем по кругу)
const topics = ["Алгебра", "Геометрия", "Комбинаторика", "Теория чисел", "Задачи на движение"];

// Функция сохранения прогресса в localStorage
function saveProgress() {
    const progressData = {
        classLevel: classLevel,
        difficulty: difficulty,
        currentTaskNum: currentTaskNum,
        allTasks: allTasks,
        userAnswers: userAnswers,
        preloadedTasks: preloadedTasks,
        tasksQueue: tasksQueue,
        previousTopics: previousTopics
    };
    localStorage.setItem('freeMockProgress', JSON.stringify(progressData));
    console.log('💾 Прогресс сохранен:', progressData);
}

// Функция восстановления прогресса из localStorage
function restoreProgress() {
    const saved = localStorage.getItem('freeMockProgress');
    if (!saved) return false;
    
    try {
        const data = JSON.parse(saved);
        
        // Восстанавливаем все переменные
        classLevel = data.classLevel;
        difficulty = data.difficulty;
        currentTaskNum = data.currentTaskNum;
        allTasks = data.allTasks || [];
        userAnswers = data.userAnswers || [];
        preloadedTasks = data.preloadedTasks || {};
        tasksQueue = data.tasksQueue || {};
        previousTopics = data.previousTopics || [];
        
        console.log('✅ Прогресс восстановлен:', data);
        return true;
    } catch (e) {
        console.error('❌ Ошибка восстановления прогресса:', e);
        localStorage.removeItem('freeMockProgress');
        return false;
    }
}

// Начало теста
function startTest() {
    classLevel = document.getElementById('class-select').value;
    difficulty = document.getElementById('difficulty-select').value;
    
    // Скрываем форму настроек
    document.getElementById('setup-form').style.display = 'none';
    
    // Сбрасываем состояние
    currentTaskNum = 1;
    tasksQueue = {};
    userAnswers = [];
    allTasks = [];
    previousTopics = [];
    isFetchingNext = false;
    preloadedTasks = {};
    
    // Сохраняем начальное состояние
    saveProgress();
    
    // Загружаем первую задачу
    loadTask(1);
}

// Загрузка задачи (с показом спиннера и ТИХИМ авто-повтором)
async function loadTask(taskNum) {
    // Проверяем, есть ли задача уже в очереди
    if (tasksQueue[taskNum]) {
        console.log(`✅ Задача ${taskNum} уже в очереди, используем её`);
        renderTask(tasksQueue[taskNum], taskNum);
        return;
    }
    
    // Показываем спиннер
    document.getElementById('loading-spinner').style.display = 'block';
    document.getElementById('task-block').style.display = 'none';
    document.getElementById('loading-text').textContent = `Генерация задачи ${taskNum}/25...`;
    
    try {
        const task = await fetchTask(taskNum);  // fetchTask теперь сам делает авто-повтор
        tasksQueue[taskNum] = task;
        renderTask(task, taskNum);
    } catch (error) {
        // Только если ВСЕ попытки исчерпаны (после 10 попыток)
        console.error('❌ Критическая ошибка после всех попыток:', error);
        document.getElementById('loading-spinner').style.display = 'none';
        document.getElementById('loading-text').textContent = 'Не удалось сгенерировать задачу. Попробуйте обновить страницу.';
        // НЕ показываем alert - просто оставляем сообщение в спиннере
    }
}

// Предзагрузка следующей задачи в фоне с автоматическими повторными попытками
async function preloadTask(taskNum, retryCount = 0) {
    const MAX_RETRIES = 3;
    const RETRY_DELAY = 2000; // 2 секунды
    
    if (taskNum > 25 || tasksQueue[taskNum] || isFetchingNext) {
        return;  // Не загружаем, если задача уже есть или идет загрузка
    }
    
    isFetchingNext = true;
    console.log(`🔄 Предзагрузка задачи ${taskNum} в фоне... (попытка ${retryCount + 1}/${MAX_RETRIES})`);
    
    try {
        const task = await fetchTask(taskNum);
        
        // Проверяем, что задача действительно получена (не null)
        if (task === null) {
            console.log(`⛔ Задача ${taskNum} > 25, предзагрузка остановлена`);
            isFetchingNext = false;
            return;
        }
        
        tasksQueue[taskNum] = task;
        console.log(`✅ Задача ${taskNum} предзагружена успешно`);
        isFetchingNext = false;
    } catch (error) {
        console.error(`❌ Ошибка предзагрузки задачи ${taskNum} (попытка ${retryCount + 1}):`, error);
        
        // Если не достигли максимума попыток, пробуем еще раз через 2 секунды
        if (retryCount < MAX_RETRIES - 1) {
            console.log(`⏳ Повторная попытка через ${RETRY_DELAY/1000} секунд...`);
            isFetchingNext = false;
            
            setTimeout(() => {
                preloadTask(taskNum, retryCount + 1);
            }, RETRY_DELAY);
        } else {
            console.error(`💥 Все ${MAX_RETRIES} попытки исчерпаны для задачи ${taskNum}`);
            isFetchingNext = false;
        }
    }
}

// Fetch задачи с сервера (С РОТАЦИЕЙ ТЕМ, КОНТЕКСТОМ И ТИХИМ АВТО-ПОВТОРОМ)
async function fetchTask(taskNum, retryCount = 0) {
    // ЖЕСТКАЯ ПРОВЕРКА: не генерируем задачи после 25-й
    if (taskNum > 25) {
        console.log(`⛔ Попытка сгенерировать задачу ${taskNum} > 25, игнорируем`);
        return null;
    }
    
    const MAX_RETRIES = 10;  // До 10 попыток
    const RETRY_DELAY = 2000;  // 2 секунды между попытками
    
    // Определяем целевую тему по номеру задачи (ротация по 5 темам)
    const targetTopic = topics[(taskNum - 1) % 5];
    
    // Собираем краткие описания уже сгенерированных задач (первые 100 символов)
    const previous_tasks = allTasks.map(t => t.text.substring(0, 100));
    
    try {
        const response = await fetch('/api/free_mock/generate_single_task', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                class_level: classLevel,
                difficulty: difficulty,
                task_number: taskNum,
                previous_topics: previousTopics,
                target_topic: targetTopic,
                previous_tasks: previous_tasks
            })
        });
        
        // Если сервер вернул ошибку (500 или другую)
        if (!response.ok) {
            const error = await response.json().catch(() => ({ error: 'Ошибка сервера' }));
            
            // ТИХИЙ АВТО-ПОВТОР: не показываем ошибку пользователю
            if (retryCount < MAX_RETRIES) {
                console.log(`⚠️ Ошибка генерации задачи ${taskNum} (попытка ${retryCount + 1}/${MAX_RETRIES}): ${error.error}`);
                console.log(`⏳ Повторная попытка через ${RETRY_DELAY/1000} секунд...`);
                
                // Ждем и пробуем снова
                await new Promise(resolve => setTimeout(resolve, RETRY_DELAY));
                return fetchTask(taskNum, retryCount + 1);
            } else {
                // Исчерпаны все попытки - только тогда выбрасываем ошибку
                throw new Error(`Не удалось сгенерировать задачу после ${MAX_RETRIES} попыток`);
            }
        }
        
        const task = await response.json();
        
        // Добавляем тему в список использованных
        if (task.topic && !previousTopics.includes(task.topic)) {
            previousTopics.push(task.topic);
        }
        
        // Сохраняем прогресс после успешной загрузки задачи
        preloadedTasks[taskNum] = task;
        saveProgress();
        
        console.log(`✅ Задача ${taskNum} успешно сгенерирована${retryCount > 0 ? ` (после ${retryCount + 1} попыток)` : ''}`);
        return task;
        
    } catch (error) {
        // Ошибка сети или парсинга JSON
        if (retryCount < MAX_RETRIES) {
            console.log(`⚠️ Ошибка сети для задачи ${taskNum} (попытка ${retryCount + 1}/${MAX_RETRIES}): ${error.message}`);
            console.log(`⏳ Повторная попытка через ${RETRY_DELAY/1000} секунд...`);
            
            await new Promise(resolve => setTimeout(resolve, RETRY_DELAY));
            return fetchTask(taskNum, retryCount + 1);
        } else {
            throw error;
        }
    }
}

// Рендеринг задачи
function renderTask(task, taskNum) {
    const container = document.getElementById('current-task-container');
    
    container.innerHTML = `
        <div style="background: var(--bg-card); backdrop-filter: blur(12px); padding: 30px; border-radius: var(--radius-lg); border: 1px solid var(--border-soft); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);">
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="color: var(--accent-2); margin: 0;">Задача ${taskNum}</h3>
                <span style="padding: 6px 12px; background: rgba(56, 189, 248, 0.1); color: var(--accent-2); border-radius: 8px; font-size: 14px; font-weight: 600;">
                    Уровень ${task.difficulty || difficulty}
                </span>
            </div>
            
            <div style="color: var(--text-soft); line-height: 1.8; margin-bottom: 25px; white-space: pre-wrap;">
                ${task.text}
            </div>
            
            <div style="margin-top: 20px;">
                <label style="display: block; color: var(--text-muted); margin-bottom: 10px; font-weight: 500;">
                    Ваш ответ:
                </label>
                <input type="text" 
                       id="current-answer" 
                       placeholder="Введите ответ"
                       style="width: 100%; padding: 15px; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-mid); border-radius: var(--radius-sm); color: var(--text-main); font-size: 16px; caret-color: var(--accent-2);"
                       onfocus="this.style.borderColor='var(--accent-2)'"
                       onblur="this.style.borderColor='var(--border-mid)'"
                       onkeypress="if(event.key==='Enter') nextTask()">
            </div>
            
        </div>
    `;
    
    // Скрываем спиннер, показываем задачу
    document.getElementById('loading-spinner').style.display = 'none';
    document.getElementById('task-block').style.display = 'block';
    
    // Рендерим математику с помощью KaTeX
    function renderKaTeX() {
        if (window.renderMathInElement) {
            renderMathInElement(container, {
                delimiters: [
                    {left: '\\(', right: '\\)', display: false},
                    {left: '\\[', right: '\\]', display: true},
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ],
                throwOnError: false,
                strict: false
            });
            console.log('✓ KaTeX rendered task', taskNum);
        } else {
            // KaTeX еще не загружен, ждем
            console.log('⏳ Waiting for KaTeX...');
            setTimeout(renderKaTeX, 200);
        }
    }
    
    // Запускаем рендеринг
    setTimeout(renderKaTeX, 100);
    
    // Обновляем прогресс
    updateProgress(taskNum);
    
    // Фокус на поле ввода
    document.getElementById('current-answer').focus();
    
    // СРАЗУ ПОСЛЕ РЕНДЕРА запускаем предзагрузку следующей задачи
    if (taskNum < 25) {
        preloadTask(taskNum + 1);
    }
}

// Обновление прогресса
function updateProgress(taskNum) {
    const progressText = document.getElementById('progress-text');
    const progressBar = document.getElementById('progress-bar');
    const nextButton = document.getElementById('next-button');
    
    progressText.textContent = `Задача ${taskNum}/25`;
    progressBar.style.width = `${(taskNum / 25) * 100}%`;
    
    // Меняем текст кнопки на последней задаче
    if (taskNum === 25) {
        nextButton.textContent = '✅ Завершить тест';
        nextButton.onclick = finishMock;
    } else {
        nextButton.textContent = 'Далее →';
        nextButton.onclick = nextTask;
    }
}

// Переход к следующей задаче
function nextTask() {
    // Собираем ответ
    const answerInput = document.getElementById('current-answer');
    const answer = answerInput ? answerInput.value.trim() : '';
    
    // Проверяем, что ответ заполнен
    if (answer === '') {
        alert('Пожалуйста, введите ответ');
        return;
    }
    
    // Сохраняем ответ и задачу
    userAnswers.push(answer);
    allTasks.push(tasksQueue[currentTaskNum]);
    
    // СОХРАНЯЕМ ПРОГРЕСС после каждого ответа
    saveProgress();
    
    // Переходим к следующей задаче
    currentTaskNum++;
    
    // Проверяем, есть ли следующая задача в очереди
    if (tasksQueue[currentTaskNum]) {
        // Мгновенно рендерим её
        renderTask(tasksQueue[currentTaskNum], currentTaskNum);
    } else {
        // Показываем спиннер и ждем загрузки
        loadTask(currentTaskNum);
    }
}

// Завершение теста
async function finishMock() {
    // Собираем последний ответ
    const answerInput = document.getElementById('current-answer');
    const answer = answerInput ? answerInput.value.trim() : '';
    
    // Проверяем, что ответ заполнен
    if (answer === '') {
        alert('Пожалуйста, введите ответ');
        return;
    }
    
    // ИСПРАВЛЕНИЕ: Проверяем, не добавлен ли уже ответ для текущей задачи
    // Если длина ответов меньше длины задач, добавляем ответ
    if (userAnswers.length < allTasks.length) {
        userAnswers.push(answer);
    } else if (userAnswers.length === allTasks.length) {
        // Обновляем последний ответ (на случай, если пользователь изменил его)
        userAnswers[userAnswers.length - 1] = answer;
    }
    
    // Добавляем текущую задачу, если она еще не в массиве
    if (allTasks.length < currentTaskNum && tasksQueue[currentTaskNum]) {
        allTasks.push(tasksQueue[currentTaskNum]);
    }
    
    console.log(`📊 Отправка на проверку: ${allTasks.length} задач, ${userAnswers.length} ответов`);
    
    // Показываем спиннер
    document.getElementById('task-block').style.display = 'none';
    document.getElementById('loading-spinner').style.display = 'block';
    document.getElementById('loading-text').textContent = 'Проверка ответов...';
    
    try {
        const response = await fetch('/api/free_mock/evaluate', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                tasks: allTasks,
                answers: userAnswers
            })
        });
        
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || 'Ошибка проверки');
        }
        
        const results = await response.json();
        
        // ОЧИЩАЕМ localStorage после завершения теста
        localStorage.removeItem('freeMockProgress');
        console.log('🗑️ Прогресс очищен после завершения теста');
        
        // Рендерим результаты
        renderResults(results);
        
        // Скрываем спиннер, показываем результаты
        document.getElementById('loading-spinner').style.display = 'none';
        document.getElementById('results-block').style.display = 'block';
        
    } catch (error) {
        console.error('Ошибка:', error);
        alert('Ошибка проверки ответов: ' + error.message);
        document.getElementById('loading-spinner').style.display = 'none';
        document.getElementById('task-block').style.display = 'block';
    }
}

// Рендеринг результатов
function renderResults(data) {
    const container = document.getElementById('results-block');
    
    const percentage = Math.round((data.correct_count / data.total_count) * 100);
    
    container.innerHTML = `
        <div style="background: var(--bg-card); backdrop-filter: blur(12px); padding: 40px; border-radius: var(--radius-lg); border: 1px solid var(--border-soft); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); text-align: center;">
            
            <h2 style="color: var(--accent-2); margin-bottom: 30px;">🎉 Тест завершен!</h2>
            
            <div style="font-size: 3em; color: var(--accent-1); margin-bottom: 20px; font-weight: 700;">
                ${data.score}
            </div>
            
            <div style="font-size: 1.5em; color: var(--text-soft); margin-bottom: 40px;">
                ${percentage}% правильных ответов
            </div>
            
            <div style="text-align: left; margin-bottom: 30px;">
                <div style="background: rgba(34, 197, 94, 0.1); padding: 20px; border-radius: var(--radius-sm); border: 1px solid rgba(34, 197, 94, 0.3); margin-bottom: 15px;">
                    <h3 style="color: #22c55e; margin-bottom: 10px;">💪 Сильные темы:</h3>
                    <p style="color: var(--text-soft); margin: 0;">${data.strong_topics}</p>
                </div>
                
                <div style="background: rgba(239, 68, 68, 0.1); padding: 20px; border-radius: var(--radius-sm); border: 1px solid rgba(239, 68, 68, 0.3); margin-bottom: 15px;">
                    <h3 style="color: #ef4444; margin-bottom: 10px;">📚 Слабые темы:</h3>
                    <p style="color: var(--text-soft); margin: 0;">${data.weak_topics}</p>
                </div>
                
                <div style="background: rgba(56, 189, 248, 0.1); padding: 20px; border-radius: var(--radius-sm); border: 1px solid rgba(56, 189, 248, 0.3);">
                    <h3 style="color: var(--accent-2); margin-bottom: 10px;">💡 Рекомендации:</h3>
                    <p style="color: var(--text-soft); margin: 0;">${data.feedback}</p>
                </div>
            </div>
            
            <div style="display: flex; gap: 15px; justify-content: center; margin-bottom: 40px;">
                <button onclick="location.reload()"
                        style="padding: 15px 30px; background: linear-gradient(135deg, var(--accent-2) 0%, var(--accent-1) 100%); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);">
                    🔄 Пройти еще раз
                </button>
                <button onclick="window.location.href='/'"
                        style="padding: 15px 30px; background: rgba(15, 23, 42, 0.6); color: var(--text-main); border: 1px solid var(--border-mid); border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer;">
                    🏠 На главную
                </button>
            </div>
            
        </div>
        
        <!-- ДЕТАЛЬНЫЙ РАЗБОР ВСЕХ ЗАДАЧ -->
        <div style="background: var(--bg-card); backdrop-filter: blur(12px); padding: 30px; border-radius: var(--radius-lg); border: 1px solid var(--border-soft); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); margin-top: 30px;">
            <h2 style="color: var(--accent-2); margin-bottom: 25px; text-align: center;">📋 Детальный разбор</h2>
            
            <div id="detailed-results">
                ${data.results.map(r => `
                    <div style="border: 1px solid var(--border-soft); padding: 20px; margin-bottom: 15px; border-radius: var(--radius-sm); background: rgba(15, 23, 42, 0.4);">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                            <h4 style="color: var(--text-main); margin: 0;">Задача ${r.task_num}</h4>
                            <span style="padding: 4px 12px; border-radius: 6px; font-size: 14px; font-weight: 600; ${r.is_correct ? 'background: rgba(34, 197, 94, 0.2); color: #22c55e;' : 'background: rgba(239, 68, 68, 0.2); color: #ef4444;'}">
                                ${r.is_correct ? '✓ Верно' : '✗ Неверно'}
                            </span>
                        </div>
                        
                        <div style="margin-bottom: 10px;">
                            <span style="color: var(--text-muted);">Ваш ответ:</span>
                            <span style="color: ${r.is_correct ? '#22c55e' : '#ef4444'}; font-weight: 600; margin-left: 10px;">${r.user_answer || '(не указан)'}</span>
                        </div>
                        
                        <div style="margin-bottom: 15px;">
                            <span style="color: var(--text-muted);">Правильный ответ:</span>
                            <span style="color: var(--accent-2); font-weight: 600; margin-left: 10px;">${r.correct_answer}</span>
                        </div>
                        
                        <button onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'; this.textContent = this.textContent.includes('Показать') ? '▲ Скрыть решение' : '▼ Показать решение';"
                                style="padding: 8px 16px; background: rgba(56, 189, 248, 0.1); color: var(--accent-2); border: 1px solid var(--accent-2); border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500;">
                            ▼ Показать решение
                        </button>
                        
                        <div style="display: none; margin-top: 15px; padding: 15px; background: rgba(56, 189, 248, 0.05); border-left: 3px solid var(--accent-2); border-radius: 4px;">
                            <p style="color: var(--text-soft); margin: 0; line-height: 1.6;">${r.solution}</p>
                        </div>
                    </div>
                `).join('')}
            </div>
        </div>
    `;
}

// ИНИЦИАЛИЗАЦИЯ ПРИ ЗАГРУЗКЕ СТРАНИЦЫ - проверка сохраненного прогресса
window.addEventListener('DOMContentLoaded', function() {
    console.log('🔍 Проверка сохраненного прогресса...');
    
    if (restoreProgress()) {
        // Есть сохраненный прогресс - спрашиваем пользователя
        if (confirm('У вас есть незаконченный пробник. Хотите продолжить?')) {
            console.log('✅ Пользователь выбрал продолжить');
            
            // Скрываем форму настроек
            document.getElementById('setup-form').style.display = 'none';
            
            // Проверяем, есть ли текущая задача в очереди
            if (tasksQueue[currentTaskNum]) {
                // Рендерим текущую задачу
                renderTask(tasksQueue[currentTaskNum], currentTaskNum);
                
                // Запускаем предзагрузку следующей задачи
                if (currentTaskNum < 25) {
                    preloadTask(currentTaskNum + 1);
                }
            } else {
                // Если задачи нет в очереди, загружаем её
                loadTask(currentTaskNum);
            }
        } else {
            console.log('❌ Пользователь выбрал начать заново');
            // Очищаем сохраненный прогресс
            localStorage.removeItem('freeMockProgress');
            // Показываем форму настроек (она уже видна по умолчанию)
        }
    } else {
        console.log('ℹ️ Сохраненного прогресса нет');
    }
});
</script>

{% endblock %}
