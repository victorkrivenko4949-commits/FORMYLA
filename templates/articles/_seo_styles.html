{# Same editorial treatment as fiztech.html; the shared article stylesheet stays unchanged. #}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/article_school_to_olympiad.css') }}?v={{ asset_version }}">
<style>
  .fa .fa-hero--ft{background:#0b1428}
  .fa .fa-hero--ft .fa-hero__shade{background:linear-gradient(90deg,#0b1428 0%,#0b1428 30%,rgba(11,20,40,.2) 60%,rgba(11,20,40,0) 100%),linear-gradient(0deg,#070C18 0%,rgba(7,12,24,0) 40%)}
  .fa .fa-hero--ft .fa-hero__img{object-fit:contain;object-position:right center;width:62%}
  .fa .fa-kpi{list-style:none;padding:0!important;margin:30px auto!important;max-width:900px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  @media(min-width:760px){.fa .fa-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}}
  .fa .fa-kpi li{margin:0;background:var(--field);border:1px solid var(--border-mid);border-radius:14px;padding:16px 18px}
  .fa .fa-kpi b{display:block;font-family:var(--serif);font-size:2rem;line-height:1;color:var(--amber);margin-bottom:6px;font-variant-numeric:lining-nums;overflow-wrap:anywhere}
  .fa .fa-kpi span{color:var(--muted);font-size:.9rem;line-height:1.4}
  .fa .fa-chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
  .fa .fa-chip{display:inline-block;padding:5px 12px;border-radius:999px;border:1px solid rgba(244,162,89,.45);background:rgba(244,162,89,.1);color:var(--amber-l);font-size:.8125rem;font-weight:700}
  .fa .fa-verdict{margin:26px 0;padding:20px 22px;border-radius:16px;background:linear-gradient(135deg,rgba(244,162,89,.14),rgba(244,162,89,.04));border:1px solid rgba(244,162,89,.45)}
  .fa .fa-verdict p{margin:0!important;color:#fff!important;font-size:1.05rem}
  .fa .fa-verdict p b{color:var(--amber)}
  /* Longer guides keep the same HUD, with a local scroll rather than page overflow. */
  .fa .fa-hud{overflow-x:auto}
  .fa .fa-hud ol{min-width:640px;max-width:1000px}
  .fa .fa-hud a{padding:2px 5px;text-align:center}
  .fa .fa-hud a span{max-width:12ch;line-height:1.3}
  .fa .fa-col{overflow-wrap:break-word}
  .fa .fa-chip--review{border-radius:8px;vertical-align:baseline}
  @media(max-width:719px){
    .fa .fa-hero--ft .fa-hero__img{width:100%;object-position:center}
    .fa .fa-hero--ft .fa-hero__shade{background:linear-gradient(0deg,#0b1428 0%,rgba(11,20,40,0) 55%)}
  }
</style>
