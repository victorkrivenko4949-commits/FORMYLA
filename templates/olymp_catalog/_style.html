  const grid=root.querySelector('.oc-cards');if(grid){const label=document.createElement('label');label.className='oc-catalog-find';const title=document.createElement('span');title.textContent='НАЙТИ ОЛИМПИАДУ';const input=document.createElement('input');input.type='search';input.placeholder='Название олимпиады';label.append(title,input);const status=document.createElement('p');status.className='oc-find-status';status.setAttribute('role','status');grid.before(label,status);const cards=Array.from(grid.querySelectorAll('.oc-card'));input.addEventListener('input',()=>{const q=input.value.trim().toLocaleLowerCase('ru');let n=0;cards.forEach(c=>{c.hidden=!c.querySelector('.nm').textContent.toLocaleLowerCase('ru').includes(q);if(!c.hidden)n++;});status.textContent=n?'Найдено: '+n:'Ничего не найдено. Измените название.';});}
