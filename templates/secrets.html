{% extends "base.html" %}

{% block title %}Секреты олимпиадников - FORMYLA{% endblock %}

{% block content %}
<h1 class="page-title">📚 Секреты олимпиадников</h1>
<p class="page-subtitle">Методы и приёмы решения олимпиадных задач</p>

<div class="cards-grid">
    {% for slug, title in topics.items() %}
    <a href="{{ url_for('secret_topic', topic_slug=slug) }}" class="card">
        <h2 class="card-title">{{ title }}</h2>
        <p class="card-text">Теория, формулы и примеры</p>
    </a>
    {% endfor %}
</div>
{% endblock %}
