<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Предпросмотр LaTeX миграции</title>
    
    <!-- MathJax Configuration -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true,
          processEnvironments: true
        },
        startup: {
          pageReady: () => {
            return MathJax.startup.defaultPageReady().then(() => {
              console.log('✓ MathJax loaded and ready');
            });
          }
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #0f172a;
            color: #e2e8f0;
        }
        h1 {
            color: #38bdf8;
            text-align: center;
        }
        .comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
            padding: 20px;
            background: #1e293b;
            border-radius: 8px;
        }
        .version {
            padding: 15px;
            border-radius: 8px;
        }
        .original {
            background: #7f1d1d;
            border: 2px solid #dc2626;
        }
        .latex {
            background: #14532d;
            border: 2px solid #22c55e;
        }
        h3 {
            margin-top: 0;
            color: #fff;
        }
        .problem-text {
            line-height: 1.6;
            font-size: 16px;
        }
        .meta {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .highlight {
            background: rgba(56, 189, 248, 0.2);
            padding: 2px 4px;
            border-radius: 3px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <h1>🔬 Предпросмотр LaTeX миграции олимпиад</h1>
    
    <div id="content">
        <div class="loading">Загрузка данных...</div>
    </div>

    <script>
        async function loadAndDisplay() {
            try {
                const response = await fetch('olympiads_latex.json');
                const data = await response.json();
                
                const contentDiv = document.getElementById('content');
                contentDiv.innerHTML = '';
                
                // Show first 3 olympiads with problems
                const samplesToShow = 3;
                let shown = 0;
                
                for (let i = 0; i < data.length && shown < samplesToShow; i++) {
                    const olympiad = data[i];
                    if (!olympiad.problems || olympiad.problems.length === 0) continue;
                    
                    const problem = olympiad.problems[0]; // First problem
                    
                    const comparisonDiv = document.createElement('div');
                    comparisonDiv.className = 'comparison';
                    
                    comparisonDiv.innerHTML = `
                        <div class="version original">
                            <h3>❌ ОРИГИНАЛ (без LaTeX)</h3>
                            <div class="meta">
                                ${olympiad.olympiad_title || 'Олимпиада'}, 
                                ${olympiad.year || '?'} год, 
                                ${olympiad.grade || '?'} класс, 
                                Задача №${problem.num || '?'}
                            </div>
                            <div class="problem-text">
                                ${problem.text || 'Нет текста'}
                            </div>
                        </div>
                        
                        <div class="version latex">
                            <h3>✅ С LaTeX (красиво!)</h3>
                            <div class="meta">
                                ${olympiad.olympiad_title || 'Олимпиада'}, 
                                ${olympiad.year || '?'} год, 
                                ${olympiad.grade || '?'} класс, 
                                Задача №${problem.num || '?'}
                            </div>
                            <div class="problem-text">
                                ${problem.text_latex || problem.text || 'Нет текста'}
                            </div>
                        </div>
                    `;
                    
                    contentDiv.appendChild(comparisonDiv);
                    shown++;
                }
                
                // Trigger MathJax to render
                if (window.MathJax) {
                    MathJax.typesetPromise();
                }
                
                // Add stats
                const statsDiv = document.createElement('div');
                statsDiv.style.cssText = 'text-align: center; margin-top: 40px; padding: 20px; background: #1e293b; border-radius: 8px;';
                statsDiv.innerHTML = `
                    <h2>📊 Статистика миграции</h2>
                    <p>Обработано олимпиад: <strong>${data.length}/798</strong></p>
                    <p>Прогресс: <strong>${(data.length/798*100).toFixed(1)}%</strong></p>
                    <p style="color: #94a3b8; font-size: 14px;">Обновите страницу, чтобы увидеть новые результаты</p>
                `;
                contentDiv.appendChild(statsDiv);
                
            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <div class="loading" style="color: #ef4444;">
                        ❌ Ошибка загрузки: ${error.message}<br>
                        <small>Убедитесь, что файл olympiads_latex.json существует</small>
                    </div>
                `;
            }
        }
        
        // Load on page load
        loadAndDisplay();
    </script>
</body>
</html>
