databases:
  - name: formyla-db
    # ВАЖНО: должно совпадать с реальным планом в Render Dashboard.
    # Текущий план — Pro-8gb (8 GB RAM, 2 CPU, 100 GB). Если поставить меньше,
    # Blueprint sync попытается даунгрейднуть БД → "Updating Instance" → простой.
    plan: pro-8gb
    databaseName: formyla
    user: formyla

services:
  - type: web
    name: formyla-com
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # КРИТИЧНО: --workers 1 + БЕЗ --preload.
    # Render plan: starter = 512 MB RAM. 2 worker'а × ~250-300 MB (matplotlib +
    # numpy + Sentry + SQLAlchemy + 9773 adaptive_tasks + 1213 probniks) → OOM →
    # SIGKILL → 502/timeout на ВСЕХ маршрутах.
    # Историю не повторять: f96cb1c (fix) → 26fa7c5 (revert) → опять 502.
    # До 7b018a9 этот конфиг работал стабильно месяцами.
    # --timeout 120 — стандарт для psycopg wait на медленные запросы Postgres.
    # Flask-Migrate: выполняем неприменённые миграции перед стартом сервера.
    # Команда идемпотентна — безопасно запускать при каждом деплое/рестарте.
    startCommand: >-
      flask db upgrade --directory alembic_migrations &&
      gunicorn app:app --workers 1 --timeout 120 --graceful-timeout 30 --bind 0.0.0.0:$PORT
    # КРИТИЧНО: Health Check Path = /healthz (НЕ /, НЕ /profile!).
    # /healthz отдаёт 200 без обращения к БД. /profile требует Postgres +
    # Flask-Login → при тормозах БД health-check виснет → Render думает что
    # сервис мёртв → SIGKILL worker → crash-loop → 500 для всех.
    # См. инцидент 2026-05-25: health-checker дёргал /profile,
    # ensure_guest_user в before_request висел в psycopg.wait_c() → SystemExit.
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: formyla-db
          property: connectionString
      - key: FLASK_APP
        value: app.py
      - key: FLASK_ENV
        value: production
      # Включаем автозагрузку 89 методов олимпиадного каталога при пустых
      # или неполных таблицах (см. services/olympiad_autoseed.py).
      - key: OLYMPIAD_AUTOSEED
        value: "1"
      - key: SECRET_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USE_SSL
        sync: false
      - key: MAIL_USE_TLS
        sync: false
      - key: DOMAIN_URL
        sync: false
      - key: DB_UPLOAD_TOKEN
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # --- Infrastructure batch (Sentry / Brevo / Telegram / Plausible) ---
      - key: SENTRY_DSN
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: PLAUSIBLE_DOMAIN
        sync: false
      # Web Push Notifications (VAPID keys)
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIM_EMAIL
        sync: false
