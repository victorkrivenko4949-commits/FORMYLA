databases:
  - name: formyla-db
    plan: free
    databaseName: formyla
    user: formyla

services:
  - type: web
    name: formyla-com
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --timeout 600 --graceful-timeout 30 --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: formyla-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USE_SSL
        sync: false
      - key: MAIL_USE_TLS
        sync: false
      - key: DOMAIN_URL
        sync: false
      - key: DB_UPLOAD_TOKEN
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
