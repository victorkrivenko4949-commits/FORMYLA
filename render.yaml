databases:
  - name: formyla-db
    # ВАЖНО: должно совпадать с реальным планом в Render Dashboard.
    # Текущий план — Pro-8gb (8 GB RAM, 2 CPU, 100 GB). Если поставить меньше,
    # Blueprint sync попытается даунгрейднуть БД → "Updating Instance" → простой.
    plan: pro-8gb
    databaseName: formyla
    user: formyla

services:
  - type: web
    name: formyla-com
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # --workers 1 + БЕЗ --preload: на Render plan: starter всего 512 MB RAM,
    # 2 worker'а × ~250-300 MB упирались в OOM → SIGKILL → 500 на всех тяжёлых
    # маршрутах (см. логи 2026-05-25 13:10:38: "Worker was sent SIGKILL! Perhaps
    # out of memory?"). Один worker укладывается в ~300 MB, остаётся запас для
    # SQLAlchemy connection pool и LiveKit/WebRTC peer-сессий.
    # --timeout 120 — стандарт для psycopg wait на медленные запросы Postgres.
    startCommand: gunicorn app:app --workers 1 --timeout 120 --graceful-timeout 30 --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: formyla-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      # Включаем автозагрузку 89 методов олимпиадного каталога при пустых
      # или неполных таблицах (см. services/olympiad_autoseed.py).
      - key: OLYMPIAD_AUTOSEED
        value: "1"
      - key: SECRET_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USE_SSL
        sync: false
      - key: MAIL_USE_TLS
        sync: false
      - key: DOMAIN_URL
        sync: false
      - key: DB_UPLOAD_TOKEN
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # --- Infrastructure batch (Sentry / Brevo / Telegram / Plausible) ---
      - key: SENTRY_DSN
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: PLAUSIBLE_DOMAIN
        sync: false
