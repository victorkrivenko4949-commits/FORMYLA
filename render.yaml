databases:
  - name: formyla-db
    plan: free
    databaseName: formyla
    user: formyla

services:
  - type: web
    name: formyla-com
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --preload — единственный fork, экономит ~40–60% RAM (особенно с тяжёлым app.py).
    # --max-requests + jitter — перезапускает воркер раз в ~500 запросов,
    #   освобождая память от утечек.
    # --threads 4 — параллелим I/O запросы без лишних воркеров.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --graceful-timeout 30 --max-requests 500 --max-requests-jitter 50 --preload --bind 0.0.0.0:$PORT
    # Render будет дёргать /healthz (лёгкий probe без БД) вместо тяжёлого /.
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: formyla-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      # Включаем автозагрузку 89 методов олимпиадного каталога при пустых
      # или неполных таблицах (см. services/olympiad_autoseed.py).
      - key: OLYMPIAD_AUTOSEED
        value: "1"
      - key: SECRET_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USE_SSL
        sync: false
      - key: MAIL_USE_TLS
        sync: false
      - key: DOMAIN_URL
        sync: false
      - key: DB_UPLOAD_TOKEN
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # --- Infrastructure batch (Sentry / Brevo / Telegram / Plausible) ---
      - key: SENTRY_DSN
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: PLAUSIBLE_DOMAIN
        sync: false
