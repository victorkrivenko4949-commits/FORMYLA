name: bank-level-report

on:
  push:
    branches: [fix/daily-bank-level-priority]
    paths-ignore: ['reports/**', 'FORMYLA_BANK.jsonl']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cleanup (apply)
        run: python scripts/bank_cleanup.py --apply
      - name: Build report
        run: python scripts/bank_level_report.py --min 5 --out reports/bank_level_report.md
      - name: Audit bank
        run: python scripts/bank_audit.py --out reports/bank_audit.md
      - name: Commit
        run: |
          git config user.name 'formyla-bot'
          git config user.email 'bot@formyla.net'
          git add reports/ FORMYLA_BANK.jsonl
          git diff --cached --quiet || git commit -m 'chore(bank): cleanup applied + reports [skip ci]'
          git push
