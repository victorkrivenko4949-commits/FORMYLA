name: lomonosov-audit

on:
  push:
    branches: [lomonosov-audit]
    paths:
      - 'data/olymp_catalog/lomonosov.json'
      - 'scripts/lomonosov_audit.py'
      - 'scripts/olymp_fix_rules.py'
      - '.github/workflows/lomonosov_audit.yml'
  workflow_dispatch:
    inputs:
      write:
        description: 'Записать исправленный lomonosov.json (true/false)'
        default: 'true'
      year_mode:
        description: 'season_end (2025 = сезон 2024/25) или season_start'
        default: 'season_end'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run audit
        run: |
          mkdir -p reports
          WRITE="${{ github.event.inputs.write || 'true' }}"
          MODE="${{ github.event.inputs.year_mode || 'season_end' }}"
          if [ "$WRITE" = "true" ]; then
            python scripts/lomonosov_audit.py --write --year-mode "$MODE"
          else
            python scripts/lomonosov_audit.py --year-mode "$MODE"
          fi
      - name: Commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/olymp_catalog/lomonosov.json reports/lomonosov_audit.md reports/lomonosov_audit_tasks.csv reports/lomonosov_audit_diff.jsonl
          git diff --cached --quiet || git commit -m "lomonosov: LaTeX fix + audit report [skip ci]"
          git push
