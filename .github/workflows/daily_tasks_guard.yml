name: daily-tasks-guard

# Страховка после инцидента 14.10.2026: страница «Задачи дня» опустела,
# потому что коммит отключил банк FORMYLA_BANK.jsonl по умолчанию.
# Этот workflow падает, если банк выключен, файл битый или темы не выдают задачи.
# Не требует секретов и pip install зависимостей проекта — только pytest.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install "pytest>=8"
      - name: Daily tasks bank guard
        run: python -m pytest tests_guard -q -p no:cacheprovider
