name: olymp-figs-audit

on:
  push:
    branches: [figs-audit]
    paths-ignore:
      - 'scripts/olymp_catalog_figs_extract.py'
      - '.github/workflows/olymp_figs_extract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix orphans + audit
        run: |
          mkdir -p reports
          python scripts/olymp_catalog_figs_audit.py --fix-orphans --csv reports/olymp_figs_audit.csv --fix-csv reports/olymp_figs_fix.csv | tee reports/olymp_figs_audit_summary.txt
      - name: Commit report and fixed data
        run: |
          git config user.name "figs-audit-bot"
          git config user.email "bot@formyla.net"
          git add reports/ data/olymp_catalog/
          git commit -m "audit: fix orphan figures + report [skip ci]" || echo "no changes"
          git pull --rebase origin figs-audit || true
          git push
