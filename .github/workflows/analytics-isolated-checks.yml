name: Analytics isolated checks
on:
  push:
    branches:
      - feature/admin-stats-funnel
  pull_request:
    paths:
      - services/funnel.py
      - routes/admin_stats*.py
      - templates/admin/stats_*.html
      - tests/test_funnel_admin_stats.py
      - .github/workflows/analytics-isolated-checks.yml
permissions:
  contents: read
jobs:
  analytics-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      ADMIN_BASE_AUTOREG: '0'
      FUNNEL_ENABLED: '1'
      ADMIN_STATS_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install Flask==3.1.2 Flask-Login==0.6.3 Flask-SQLAlchemy==3.1.1 SQLAlchemy==2.0.43 pytest==8.4.2
      - name: Compile analytics modules
        run: python -m py_compile services/funnel.py routes/admin_stats.py routes/admin_stats_sections.py
      - name: Run standalone SQLite fixtures without application startup
        run: python -m pytest -c /dev/null --noconftest -q tests/test_funnel_admin_stats.py
