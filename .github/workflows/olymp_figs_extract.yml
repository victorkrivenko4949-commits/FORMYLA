name: olymp-figs-extract

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'slug олимпиады'
        default: 'formula-unity'
  push:
    branches: [figs-audit]
    paths:
      - 'scripts/olymp_catalog_figs_extract.py'
      - '.github/workflows/olymp_figs_extract.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf requests
      - name: Extract figures from source PDFs
        run: python scripts/olymp_catalog_figs_extract.py --slug "${{ github.event.inputs.slug || 'formula-unity' }}" | tee reports/olymp_figs_extract_summary.txt
      - name: Re-run audit
        run: python scripts/olymp_catalog_figs_audit.py --csv reports/olymp_figs_audit.csv | tee reports/olymp_figs_audit_summary.txt
      - name: Commit
        run: |
          git config user.name "figs-audit-bot"
          git config user.email "bot@formyla.net"
          git add reports/ data/olymp_catalog/ static/olymp_figures/FINAL_FIGURES/
          git commit -m "figs: extracted figures from source PDFs [skip ci]" || echo "no changes"
          git pull --rebase origin figs-audit || true
          git push
