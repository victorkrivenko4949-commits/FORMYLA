name: olymp-catalog-gaps

on:
  push:
    branches: [main]
    paths:
      - 'data/olymp_catalog/**'
      - 'routes/olymp_catalog_gaps.py'
      - 'scripts/olymp_catalog_gaps.py'
      - '.github/workflows/olymp_catalog_gaps.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build report
        run: |
          mkdir -p reports
          python scripts/olymp_catalog_gaps.py > reports/olymp_catalog_gaps.md
      - name: Commit report
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add reports/olymp_catalog_gaps.md
          git diff --cached --quiet || git commit -m "reports: olymp_catalog_gaps.md [skip ci]"
          git push
