<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" role="img" aria-labelledby="title desc">
  <title id="title">Квадрат 11 на 11 клеток</title>
  <desc id="desc">Вершины клеток отмечены 144 одинаковыми точками: 12 рядов по 12 точек. Цвета не заданы.</desc>
  <defs>
    <pattern id="grid" x="28" y="28" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#aab2bf" stroke-width="1"/>
    </pattern>
    <pattern id="points" x="16" y="16" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="2.5" fill="#172033"/>
    </pattern>
  </defs>
  <rect width="320" height="340" rx="12" fill="#fff"/>
  <rect x="28" y="28" width="264" height="264" fill="url(#grid)" stroke="#aab2bf"/>
  <rect x="16" y="16" width="288" height="288" fill="url(#points)"/>
  <text x="160" y="326" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#172033">11 × 11 клеток, 144 вершины</text>
</svg>
