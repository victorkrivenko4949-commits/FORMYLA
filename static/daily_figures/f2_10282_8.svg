<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500"><rect x="0" y="0" width="600" height="500" fill="#0F1729"/><text x="300" y="28" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">Прямоугольники площади 6 в сетке 5×5</text><text x="155" y="48" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">3×2</text><text x="445" y="48" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">2×3</text><g stroke="#73B6E6" stroke-width="1.2" stroke-dasharray="4 4" fill="none"><line x1="45" y1="74" x2="177" y2="74"/><line x1="45" y1="74" x2="45" y2="95"/><line x1="177" y1="74" x2="177" y2="95"/><line x1="325" y1="74" x2="413" y2="74"/><line x1="325" y1="74" x2="325" y2="95"/><line x1="413" y1="74" x2="413" y2="95"/><line x1="30" y1="95" x2="30" y2="183"/><line x1="30" y1="95" x2="45" y2="95"/><line x1="30" y1="183" x2="45" y2="183"/><line x1="310" y1="95" x2="310" y2="227"/><line x1="310" y1="95" x2="335" y2="95"/><line x1="310" y1="227" x2="335" y2="227"/></g><g fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round"><text x="111" y="67">3 клетки</text><text x="24" y="139">2 клетки</text><text x="369" y="67">2 клетки</text><text x="300" y="161">3 клетки</text></g><g stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round" fill="none"><line x1="45" y1="95" x2="265" y2="95"/><line x1="45" y1="139" x2="265" y2="139"/><line x1="45" y1="183" x2="265" y2="183"/><line x1="45" y1="227" x2="265" y2="227"/><line x1="45" y1="271" x2="265" y2="271"/><line x1="45" y1="315" x2="265" y2="315"/><line x1="45" y1="95" x2="45" y2="315"/><line x1="89" y1="95" x2="89" y2="315"/><line x1="133" y1="95" x2="133" y2="315"/><line x1="177" y1="95" x2="177" y2="315"/><line x1="221" y1="95" x2="221" y2="315"/><line x1="265" y1="95" x2="265" y2="315"/><line x1="335" y1="95" x2="555" y2="95"/><line x1="335" y1="139" x2="555" y2="139"/><line x1="335" y1="183" x2="555" y2="183"/><line x1="335" y1="227" x2="555" y2="227"/><line x1="335" y1="271" x2="555" y2="271"/><line x1="335" y1="315" x2="555" y2="315"/><line x1="335" y1="95" x2="335" y2="315"/><line x1="379" y1="95" x2="379" y2="315"/><line x1="423" y1="95" x2="423" y2="315"/><line x1="467" y1="95" x2="467" y2="315"/><line x1="511" y1="95" x2="511" y2="315"/><line x1="555" y1="95" x2="555" y2="315"/></g><g fill="#73B6E6" fill-opacity="0.18" stroke="#FFD166" stroke-width="2.2"><rect x="45" y="95" width="132" height="88"/><rect x="335" y="95" width="88" height="132"/></g><g fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round"><text x="111" y="116">S=3·2=6</text><text x="379" y="161">S=2·3=6</text><text x="155" y="354">(6−3)(6−2)=3·4=12</text><text x="445" y="354">(6−2)(6−3)=4·3=12</text></g><line x1="45" y1="385" x2="555" y2="385" stroke="#73B6E6" stroke-width="1.2" stroke-dasharray="4 4"/><text x="300" y="420" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">Итого: 12+12=24</text></svg>