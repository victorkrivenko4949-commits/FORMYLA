<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500"><rect x="0" y="0" width="600" height="500" fill="#0F1729"/><text x="300" y="42" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">Квадрат 3 × 3 клетки</text><g stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"><line x1="150" y1="100" x2="450" y2="100"/><line x1="150" y1="200" x2="450" y2="200"/><line x1="150" y1="300" x2="450" y2="300"/><line x1="150" y1="400" x2="450" y2="400"/><line x1="150" y1="100" x2="150" y2="400"/><line x1="250" y1="100" x2="250" y2="400"/><line x1="350" y1="100" x2="350" y2="400"/><line x1="450" y1="100" x2="450" y2="400"/></g><g fill="#D9E5F5" stroke="#D9E5F5" stroke-width="1.8"><circle cx="150" cy="100" r="3.5"/><circle cx="250" cy="100" r="3.5"/><circle cx="350" cy="100" r="3.5"/><circle cx="450" cy="100" r="3.5"/><circle cx="150" cy="200" r="3.5"/><circle cx="250" cy="200" r="3.5"/><circle cx="350" cy="200" r="3.5"/><circle cx="450" cy="200" r="3.5"/><circle cx="150" cy="300" r="3.5"/><circle cx="250" cy="300" r="3.5"/><circle cx="350" cy="300" r="3.5"/><circle cx="450" cy="300" r="3.5"/><circle cx="150" cy="400" r="3.5"/><circle cx="250" cy="400" r="3.5"/><circle cx="350" cy="400" r="3.5"/><circle cx="450" cy="400" r="3.5"/></g><g fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round"><text x="485" y="145">1 × 1: 9 квадратов</text><text x="485" y="250">2 × 2: 4 квадрата</text><text x="485" y="355">3 × 3: 1 квадрат</text></g><text x="300" y="458" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="r