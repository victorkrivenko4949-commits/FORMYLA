amily="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">P = 2(6 + 1) = 14</text><text x="450" y="105" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">Вертикальный разрез</text><rect x="320" y="180" width="260" height="86.67" fill="none" stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"/><line x1="450" y1="180" x2="450" y2="266.67" stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"/><circle cx="320" cy="180" r="3.5" stroke="#D9E5F5" stroke-width="1.8" fill="#D9E5F5"/><circle cx="580" cy="180" r="3.5" stroke="#D9E5F5" stroke-width="1.8" fill="#D9E5F5"/><circle cx="580" cy="266.67" r="3.5" stroke="#D9E5F5" stroke-width="1.8" fill="#D9E5F5"/><circle cx="320" cy="266.67" r="3.5" stroke="#D9E5F5" stroke-width="1.8" fill="#D9E5F5"/><text x="450" y="168" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">6</text><text x="304" y="223.33" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">2</text><text x="385" y="223.33" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">3</text><text x="515" y="223.33" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">3</text><text x=