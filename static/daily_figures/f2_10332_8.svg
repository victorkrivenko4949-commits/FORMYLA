<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
<rect x="0" y="0" width="600" height="500" fill="#0F1729"/>
<defs>
<style>
.grid{stroke:#D9E5F5;stroke-width:1.8;stroke-linecap:round;fill:none}
.dom{fill:#203B58;stroke:#D9E5F5;stroke-width:1.8;stroke-linecap:round}
.lab{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#EAF1FA;text-anchor:middle;dominant-baseline:central;paint-order:stroke fill;stroke:#0F1729;stroke-width:2;stroke-linejoin:round}
.num{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#EAF1FA;text-anchor:middle;dominant-baseline:central;paint-order:stroke fill;stroke:#203B58;stroke-width:2;stroke-linejoin:round}
</style>
</defs>
<text x="280" y="43" class="lab" font-size="16">Размещение 17 доминошек 1×2</text>
<text x="155" y="76" class="lab">1</text><text x="205" y="76" class="lab">2</text><text x="255" y="76" class="lab">3</text><text x="305" y="76" class="lab">4</text><text x="355" y="76" class="lab">5</text><text x="405" y="76" class="lab">6</text>
<text x="112" y="115" class="lab">1</text><text x="112" y="165" class="lab">2</text><text x="112" y="215" class="lab">3</text><text x="112" y="265" class="lab">4</text><text x="112" y="315" class="lab">5</text><text x="112" y="365" class="lab">6</text>
<!-- шахматная доска и вырезанные клетки -->
<rect x="130" y="90" width="300" height="300" fill="#17263B"/>
<rect x="230" y="90" width="50" height="50" fill="#633E50"/>
<rect x="380" y="90" width="50" height="50" fill="#633E50"/>
<!-- сетка -->
<path class="grid" d="M130 90H430 M130 140H430 M130 190H430 M130 240H430 M130 290H430 M130 340H430 M130 390H430 M130 90V390 M180 90V390 M230 90V390 M280 90V390 M330 90V390 M380 90V390 M430 90V390"/>
<rect x="130" y="90" width="300" height="300" class="grid" stroke-width="2.4"/>
<!-- вырезанные клетки -->
<path d="M240 100L270 130 M270 100L240 130 M390 100L420 130 M420 100L390 130" stroke="#FFD166" stroke-width="2.2" stroke-linecap="round"/>
<!-- доминошки -->
<g class="dom">
<rect x="283" y="93" width="94" height="44" rx="7"/><rect x="233" y="143" width="94" height="44" rx="7"/><rect x="333" y="143" width="94" height="44" rx="7"/>
<rect x="133" y="193" width="94" height="44" rx="7"/><rect x="233" y="193" width="94" height="44" rx="7"/><rect x="133" y="243" width="94" height="44" rx="7"/>
<rect x="333" y="193" width="94" height="44" rx="7"/><rect x="233" y="243" width="94" height="44" rx="7"/><rect x="333" y="243" width="94" height="44" rx="7"/>
<rect x="183" y="293" width="94" height="44" rx="7"/><rect x="133" y="293" width="44" height="94" rx="7"/><rect x="183" y="343" width="94" height="44" rx="7"/>
<rect x="283" y="343" width="94" height="44" rx="7"/><rect x="283" y="293" width="94" height="44" rx="7"/><rect x="383" y="293" width="44" height="94" rx="7"/>
<rect x="133" y="93" width="94" height="44" rx="7"/><rect x="133" y="143" width="94" height="44" rx="7"/>
</g>
<!-- номера доминошек -->
<g class="num">
<text x="330" y="115">1</text><text x="280" y="165">2</text><text x="380" y="165">3</text><text x="180" y="215">4</text><text x="280" y="215">5</text><text x="180" y="265">6</text><text x="380" y="215">7</text><text x="280" y="265">8</text><text x="380" y="265">9</text><text x="230" y="315">10</text><text x="155" y="340">11</text><text x="230" y="365">12</text><text x="330" y="365">13</text><text x="330" y="315">14</text><text x="405" y="340">15</text><text x="180" y="115">16</text><text x="180" y="165">17</text>
</g>
<!-- пояснения -->
<rect x="470" y="115" width="22" height="22" rx="3" fill="#633E50" stroke="#FFD166" stroke-width="1.2"/>
<path d="M475 120L487 132 M487 120L475 132" stroke="#FFD166" stroke-width="1.5" stroke-linecap="round"/>
<text x="535" y="126" class="lab">вырезанная</text><text x="535" y="146" class="lab">клетка</text>
<rect x="470" y="180" width="70" height="28" rx="7" class="dom"/>
<text x="555" y="194" class="lab">доминошка</text>
<text x="500" y="260" class="lab" font-size="18">34 клетки</text>
<text x="500" y="285" class="lab" font-size="18">= 17 доминошек</text>
<text x="500" y="350" class="lab" font-size="13">Координаты клеток:</text>
<text x="500" y="375" class="lab" font-size="13">столбец; строка</text>
</svg>