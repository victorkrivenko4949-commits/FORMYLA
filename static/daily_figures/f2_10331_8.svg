<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
<rect x="0" y="0" width="600" height="500" fill="#0F1729"/>
<defs>
  <pattern id="checker" x="100" y="70" width="120" height="120" patternUnits="userSpaceOnUse">
    <rect x="0" y="0" width="60" height="60" fill="#263854"/>
    <rect x="60" y="0" width="60" height="60" fill="#182841"/>
    <rect x="0" y="60" width="60" height="60" fill="#182841"/>
    <rect x="60" y="60" width="60" height="60" fill="#263854"/>
  </pattern>
  <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="8" height="8" fill="#713F4B"/>
    <line x1="0" y1="0" x2="0" y2="8" stroke="#FFD166" stroke-width="1.2" opacity=".65"/>
  </pattern>
  <style>
    .label{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#EAF1FA;text-anchor:middle;dominant-baseline:central;paint-order:stroke fill;stroke:#0F1729;stroke-width:2;stroke-linejoin:round}
    .small{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#EAF1FA;text-anchor:middle;dominant-baseline:central;paint-order:stroke fill;stroke:#0F1729;stroke-width:2;stroke-linejoin:round}
    .domino{fill:#73B6E6;fill-opacity:.42;stroke:#D9E5F5;stroke-width:1.8;stroke-linecap:round}
  </style>
</defs>
<text x="280" y="32" class="label" font-size="18">Покрытие доски 6×6 доминошками</text>
<text x="280" y="52" class="small">две клетки вырезаны; показаны 17 доминошек</text>
<!-- шахматная доска -->
<rect x="100" y="70" width="360" height="360" fill="url(#checker)" stroke="#D9E5F5" stroke-width="1.8"/>
<!-- доминошки -->
<rect class="domino" x="101.5" y="311.5" width="57" height="117" rx="9"/>
<rect class="domino" x="161.5" y="191.5" width="57" height="117" rx="9"/>
<rect class="domino" x="161.5" y="311.5" width="57" height="117" rx="9"/>
<rect class="domino" x="221.5" y="131.5" width="57" height="117" rx="9"/>
<rect class="domino" x="281.5" y="71.5" width="57" height="117" rx="9"/>
<rect class="domino" x="221.5" y="311.5" width="57" height="117" rx="9"/>
<rect class="domino" x="281.5" y="191.5" width="57" height="117" rx="9"/>
<rect class="domino" x="281.5" y="311.5" width="57" height="117" rx="9"/>
<rect class="domino" x="341.5" y="131.5" width="57" height="117" rx="9"/>
<rect class="domino" x="341.5" y="71.5" width="117" height="57" rx="9"/>
<rect class="domino" x="401.5" y="131.5" width="57" height="117" rx="9"/>
<rect class="domino" x="401.5" y="251.5" width="57" height="117" rx="9"/>
<rect class="domino" x="341.5" y="251.5" width="57" height="117" rx="9"/>
<rect class="domino" x="341.5" y="371.5" width="117" height="57" rx="9"/>
<rect class="domino" x="101.5" y="71.5" width="57" height="117" rx="9"/>
<rect class="domino" x="161.5" y="71.5" width="57" height="117" rx="9"/>
<rect class="domino" x="101.5" y="191.5" width="57" height="117" rx="9"/>
<!-- вырезанные клетки -->
<rect x="220" y="70" width="60" height="60" fill="url(#hatch)" stroke="#FFD166" stroke-width="1.8"/>
<rect x="220" y="250" width="60" height="60" fill="url(#hatch)" stroke="#FFD166" stroke-width="1.8"/>
<!-- сетка -->
<g fill="none" stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round" opacity=".9">
 <path d="M160 70V430 M220 70V430 M280 70V430 M340 70V430 M400 70V430"/>
 <path d="M100 130H460 M100 190H460 M100 250H460 M100 310H460 M100 370H460"/>
</g>
<!-- номера столбцов и строк -->
<g class="small">
 <text x="130" y="60">1</text><text x="190" y="60">2</text><text x="250" y="60">3</text><text x="310" y="60">4</text><text x="370" y="60">5</text><text x="430" y="60">6</text>
 <text x="82" y="100">1</text><text x="82" y="160">2</text><text x="82" y="220">3</text><text x="82" y="280">4</text><text x="82" y="340">5</text><text x="82" y="400">6</text>
</g>
<text x="250" y="100" class="label" fill="#FFD166">×</text>
<text x="250" y="280" class="label" fill="#FFD166">×</text>
<!-- номера доминошек -->
<g class="small" fill="#EAF1FA">
 <text x="130" y="370">1</text><text x="190" y="250">2</text><text x="190" y="370">3</text><text x="250" y="190">4</text><text x="310" y="130">5</text><text x="250" y="370">6</text><text x="310" y="250">7</text><text x="310" y="370">8</text><text x="370" y="190">9</text><text x="400" y="100">10</text><text x="430" y="190">11</text><text x="430" y="310">12</text><text x="370" y="310">13</text><text x="400" y="400">14</text><text x="130" y="130">15</text><text x="190" y="130">16</text><text x="130" y="250">17</text>
</g>
<g class="small">
 <rect x="100" y="456" width="18" height="18" rx="3" fill="#713F4B" stroke="#FFD166" stroke-width="1.2"/>
 <text x="210" y="465" text-anchor="start">вырезанные клетки: (1;3), (4;3)</text>
 <rect x="390" y="456" width="18" height="18" rx="4" fill="#73B6E6" fill-opacity=".42" stroke="#D9E5F5" stroke-width="1.8"/>
 <text x="420" y="465" text-anchor="start">домино</text>
</g>
</svg>