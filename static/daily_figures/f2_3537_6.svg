3</text><text x="157.5" y="258">5×5</text><text x="210" y="393">8×8</text></g><g fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round"><text x="410" y="92" font-size="15" text-anchor="start" dominant-baseline="central">Размер квадрата</text><text x="550" y="92" font-size="15" text-anchor="end" dominant-baseline="central">Количество</text><g font-size="13" text-anchor="middle" dominant-baseline="central"><text x="430" y="125">1×1</text><text x="550" y="125">8² = 64</text><text x="430" y="153">2×2</text><text x="550" y="153">7² = 49</text><text x="430" y="181">3×3</text><text x="550" y="181">6² = 36</text><text x="430" y="209">4×4</text><text x="550" y="209">5² = 25</text><text x="430" y="237">5×5</text><text x="550" y="237">4² = 16</text><text x="430" y="265">6×6</text><text x="550" y="265">3² = 9</text><text x="430" y="293">7×7</text><text x="550" y="293">2² = 4</text><text x="430" y="321">8×8</text><text x="550" y="321">1² = 1</text></g></g><line x1="400" y1="345" x2="560" y2="345" stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"/><text x="480" y="374" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">64+49+36+25</text><text x="480" y="402" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">+16+9+4+1</text><text x="480" y="445" fill="#FFD166" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">Ответ: 204</text></svg>