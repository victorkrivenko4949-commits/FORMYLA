="120" x2="117" y2="228" stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"/><line x1="153" y1="120" x2="153" y2="228" stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"/><line x1="189" y1="120" x2="189" y2="228" stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"/><line x1="225" y1="120" x2="225" y2="228" stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"/><text x="63" y="138" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2">A</text><text x="63" y="210" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2">B</text><line x1="117" y1="108" x2="117" y2="238" stroke="#73B6E6" stroke-width="1.2" stroke-dasharray="4 4"/><text x="117" y="252" fill="#A6B7CC" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2">первые 2 столбца</text><text x="171" y="174" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2">остаток</text><line x1="137" y1="140" x2="205" y2="208" stroke="#A64B5D" stroke-width="2" stroke-linecap="round"/><line x1="205" y1="140" x2="137" y2="208" stroke="#A64B5D" stroke-width="2" stroke-linecap="round"/><text x="135" y="282" fill="#FFD166" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2">3×5: невозможно</text><text x="135" y="305" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2">в 1-м столбце: 2+1</text><text x="135" y="324" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2">⇒ 2-й столбец заполнен</text><polygon points="335,120 407,120 407,192 371,192 371,156 335,156" fill="#3B82A0"/><polygon points="335,156 371,156 371,192 407,192 407,228 335,228" fill="#5B8EBC"/><polygon points="407,120 479,120 479,192 443,192 443,156 407,156" fill="#3B82A0"/><polygon points="407,156 443,156 443,192 479,192 479,228 407,228" fill="#5B8EBC"/><polygon points="479,120 551,120 551,192 515,192 515,156 479,156" fill="#3B82A0"/><polygon points="479,156 515,156 515,192 551,192 551,228 479,228" fill="#5B8EBC"/><line x1="335" y1="120" x2="551" y2="120" stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"/><line x1="335" y1="156" x2="551" y2="156" stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"/><line x1="335" y1="192" x2="551" y2="192" stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"/><line x1="335" y1="228" x2="551" y2="228" stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"/><line x1="335" y1="120" x2="335" y2="228" stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"/><line x1="371" y1="120" x2="371" y2="228" stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"/><line x1="407" y1="120" x2="407" y2="228" stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"/><line x1="443" y1="120" x2="443" y2="228" stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"/><line x1="479" y1="120" x2="479" y2="228" stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"/><line x1="515" y1="120" x2="515" y2="228" stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"/><line x1="551" y1="120" x2="551" y2="228" stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"/><text x="353" y="138" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="cen