l" paint-order="stroke fill" stroke="#0F1729" stroke-width="2">в одном столбце — 2 клетки, в другом — 1 клетку.</text><line x1="190" y1="445" x2="260" y2="445" stroke="#3B82A0" stroke-width="10" stroke-linecap="round"/><text x="275" y="445" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2">одно Г-тримино</text><rect x="190" y="465" width="70" height="12" fill="url(#blocked)"/><text x="275" y="471" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2">непокрытый остаток</text></svg>