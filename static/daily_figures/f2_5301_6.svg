<path d="M180 85V385M240 85V385M300 85V385M360 85V385M420 85V385"/>
<path d="M120 145H480M120 205H480M120 265H480M120 325H480"/>
</g>
<!-- доминошки -->
<g fill="#4B9ACA" fill-opacity="0.25" stroke="#73B6E6" stroke-width="2.2">
<rect x="364" y="209" width="112" height="52" rx="9"/><rect x="124" y="329" width="112" height="52" rx="9"/><rect x="364" y="89" width="112" height="52" rx="9"/>
<rect x="184" y="149" width="52" height="112" rx="9"/><rect x="244" y="209" width="52" height="112" rx="9"/><rect x="304" y="149" width="112" height="52" rx="9"/>
