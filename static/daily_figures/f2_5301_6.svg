<rect x="124" y="89" width="112" height="52" rx="9"/><rect x="184" y="149" width="112" height="52" rx="9"/><rect x="364" y="269" width="52" height="112" rx="9"/><rect x="304" y="209" width="52" height="112" rx="9"/><rect x="124" y="149" width="52" height="112" rx="9"/>
</g>
