<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
<rect x="0" y="0" width="600" height="500" fill="#0F1729"/>
<defs>
<style>
.label{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#EAF1FA;text-anchor:middle;dominant-baseline:central;paint-order:stroke fill;stroke:#0F1729;stroke-width:2px;stroke-linejoin:round}
.num{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#EAF1FA;text-anchor:middle;dominant-baseline:central;paint-order:stroke fill;stroke:#0F1729;stroke-width:2px;stroke-linejoin:round}
</style>
</defs>
<text x="300" y="27" class="label" font-size="17">Покрытие доски доминошками</text>
<text x="300" y="53" class="num">столбцы</text>
<text x="53" y="235" class="num" transform="rotate(-90 53 235)">строки</text>
<!-- шахматная доска -->
<g opacity="0.9">
<rect x="120" y="85" width="60" height="60" fill="#18263D"/><rect x="240" y="85" width="60" height="60" fill="#18263D"/><rect x="360" y="85" width="60" height="60" fill="#18263D"/>
<rect x="180" y="145" width="60" height="60" fill="#18263D"/><rect x="300" y="145" width="60" height="60" fill="#18263D"/><rect x="420" y="145" width="60" height="60" fill="#18263D"/>
<rect x="120" y="205" width="60" height="60" fill="#18263D"/><rect x="240" y="205" width="60" height="60" fill="#18263D"/><rect x="360" y="205" width="60" height="60" fill="#18263D"/>
<rect x="180" y="265" width="60" height="60" fill="#18263D"/><rect x="300" y="265" width="60" height="60" fill="#18263D"/><rect x="420" y="265" width="60" height="60" fill="#18263D"/>
<rect x="120" y="325" width="60" height="60" fill="#18263D"/><rect x="240" y="325" width="60" height="60" fill="#18263D"/><rect x="360" y="325" width="60" height="60" fill="#18263D"/>
</g>
