<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500"><rect x="0" y="0" width="600" height="500" fill="#0F1729"/><text x="300" y="35" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">Клетчатая доска 4 × 4</text><g stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"><line x1="140" y1="90" x2="460" y2="90"/><line x1="140" y1="170" x2="460" y2="170"/><line x1="140" y1="250" x2="460" y2="250"/><line x1="140" y1="330" x2="460" y2="330"/><line x1="140" y1="410" x2="460" y2="410"/><line x1="140" y1="90" x2="140" y2="410"/><line x1="220" y1="90" x2="220" y2="410"/><line x1="300" y1="90" x2="300" y2="410"/><line x1="380" y1="90" x2="380" y2="410"/><line x1="460" y1="90" x2="460" y2="410"/></g><g stroke="#73B6E6" stroke-width="1.2" stroke-dasharray="4 4" stroke-linecap="round"><line x1="140" y1="65" x2="460" y2="65"/><line x1="115" y1="90" x2="115" y2="410"/></g><g fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round"><text x="300" y="65">4 клетки</text><text x="115" y="250" transform="rotate(-90 115 250)">4 клетки</text><text x="180" y="445">1×1: 16</text><text x="260" y="445">2×2: 9</text><text x="340" y="445">3×3: 4</text><text x="420" y="445">4×4: 1</text></g><text x="300" y="478" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">Всего квадратов: 16 + 9 + 4 + 1 = 30</text></svg>