<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
<rect x="0" y="0" width="600" height="500" fill="#0F1729"/>
<defs>
  <style>
    .main{stroke:#D9E5F5;stroke-width:1.8;stroke-linecap:round}
    .aux{stroke:#73B6E6;stroke-width:1.2;stroke-linecap:round;stroke-dasharray:4 4}
    .label{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#EAF1FA;text-anchor:middle;dominant-baseline:central;paint-order:stroke fill;stroke:#0F1729;stroke-width:2px;stroke-linejoin:round}
    .small{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#EAF1FA;text-anchor:middle;dominant-baseline:central;paint-order:stroke fill;stroke:#0F1729;stroke-width:2px;stroke-linejoin:round}
  </style>
</defs>
<text x="300" y=" thirty" class="label" font-size="16">Покрытие доски 7×6 доминошками</text>
<text x="300" y="465" class="small">20 доминошек покрывают все 40 оставшихся клеток</text>

<!-- шахматная раскраска доски -->
<g>
  <rect x="105" y="80" width="50" height="50" fill="#B7CBE0"/><rect x="205" y="80" width="50" height="50" fill="#B7CBE0"/><rect x="305" y="80" width="50" height="50" fill="#B7CBE0"/><rect x="405" y="80" width="50" height="50" fill="#B7CBE0"/>
  <rect x="155" y="130" width="50" height="50" fill="#B7CBE0"/><rect x="255" y="130" width="50" height="50" fill="#B7CBE0"/><rect x="355" y="130" width="50" height="50" fill="#B7CBE0"/>
  <rect x="105" y="180" width="50" height="50" fill="#B7CBE0"/><rect x="205" y="180" width="50" height="50" fill="#B7CBE0"/><rect x="305" y="180" width="50" height="50" fill="#B7CBE0"/><rect x="405" y="180" width="50" height="50" fill="#B7CBE0"/>
  <rect x="155" y="230" width="50" height="50" fill="#B7CBE0"/><rect x="255" y="230" width="50" height="50" fill="#B7CBE0"/><rect x="355" y="230" width="50" height="50" fill="#B7CBE0"/>
  <rect x="105" y="280" width="50" height="50" fill="#B7CBE0"/><rect x="205" y="280" width="50" height="50" fill="#B7CBE0"/><rect x="305" y="280" width="50" height="50" fill="#B7CBE0"/><rect x="405" y="280" width="50" height="50" fill="#B7CBE0"/>
  <rect x="155" y="330" width="50" height="50" fill="#B7CBE0"/><rect x="255" y="330" width="50" height="50" fill="#B7CBE0"/><rect x="355" y="330" width="50" height="50" fill="#B7CBE0"/>
</g>
<!-- сетка -->
<g class="main" fill="none">
  <rect x="105" y="80" width="350" height="300"/>
  <path d="M155 80V380 M205 80V380 M255 80V380 M305 80V380 M355 80V380 M405 80V380 M105 130H455 M105 180H455 M105 230H455 M105 280H455 M105 330H455"/>
</g>
<!-- номера столбцов и строк -->
<g class="small">
  <text x="130" y="62">1</text><text x="180" y="62">2</text><text x="230" y="62">3</text><text x="280" y="62">4</text><text x="330" y="62">5</text><text x="380" y="62">6</text><text x="430" y="62">7</text>
  <text x="87" y="105">1</text><text x="87" y="155">2</text><text x="87" y="205">3</text><text x="87" y="255">4</text><text x="87" y="305">5</text><text x="87" y="355">6</text>
</g>
<!-- вырезанные клетки -->
<g>
  <rect x="355" y="180" width="50" height="50" fill="#0F1729"/>
  <rect x="405" y="280" width="50" height="50" fill="#0F1729"/>
  <path class="aux" d="M362 187L398 223 M398 187L362 223 M412 287L448 323 M448 287L412 323"/>
  <text x="380" y="205" class="small" font-size="10">(6;3)</text>
  <text x="430" y="305" class="small" font-size="10">(7;5)</text>
</g>
