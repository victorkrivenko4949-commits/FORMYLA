<g stroke="#A6D5F2" stroke-width="1" opacity="0.8">
  <path d="M155 84V126 M205 134V176 M305 134V176 M155 184V226 M255 184V226 M155 234V276 M430 184V226 M330 184V226 M305 234V276 M380 234V276 M205 284V326 M130 333V377 M205 334V376 M305 334V376 M255 284V326 M405 334V376 M155 84V126 M155 134V176 M430 84V176 M255 84V126"/>
