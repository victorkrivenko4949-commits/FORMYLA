<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" style="background-color:#0F1729"><rect x="0" y="0" width="600" height="500" fill="#0F1729"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#73B6E6" stroke-width="1.2"/></marker></defs><text x="195" y="60" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">Наименьший периметр</text><text x="195" y="88" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">P = 16</text><text x="405" y="60" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">Наибольший периметр</text><text x="405" y="88" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">P = 32</text><g fill="#1B2944" stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"><rect x="75" y="190" width="240" height="144" fill="#1B2944"/><line x1="123" y1="190" x2="123" y2="334"/><line x1="171" y1="190" x2="171" y2="334"/><line x1="219" y1="190" x2="219" y2="334"/><line x1="267" y1="190" x2="267" y2="334"/><line x1="75" y1="238" x2="315" y2="238"/><line x1="75" y1="286" x2="315" y2="286"/></g><g fill="none" stroke="#73B6E6" stroke-width="1.2" stroke-dasharray="4 4" stroke-linecap="round"><line x1="75" y1="174" x2="315" y2="174" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line x1="59" y1="190" x2="59" y2="334" marker-start="url(#arrow)