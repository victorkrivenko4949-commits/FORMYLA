  <rect x="75" y="125" width="120" height="60" rx="8"/>
  <rect x="375" y="185" width="120" height="60" rx="8"/>
  <rect x="195" y="185" width="60" height="120" rx="8"/>
  <rect x="315" y="185" width="60" height="60" rx="8"/>
  <rect x="135" y="185" width="60" height="120" rx="8"/>
  <rect x="255" y="245" width="120" height="60" rx="8"/>
  <rect x="375" y="245" width="120" height="60" rx="8"/>
  <rect x="135" y="305" width="120" height="60" rx="8"/>
  <rect x="75" y="305" width="60" height="120" rx="8"/>
  <rect x="375" y="305" width="120" height="60" rx="8"/>
  <rect x="195" y="305" width="120" height="60" rx="8"/>
  <rect x="315" y="365" width="120" height="60" rx="8"/>
  <rect x="135" y="365" width="120" height="60" rx="8"/>
  <rect x="375" y="365" width="120" height="60" rx="8"/>
  <rect x="75" y="185" width="60" height="60" rx="8"/>
</g>
<!-- номера строк и столбцов -->
<g class="small">
  <text x="105" y="52">1</text><text x="165" y="52">2</text><text x="225" y="52">3</text><text x="285" y="52">4</text><text x="345" y="52">5</text><text x="405" y="52">6</text><text x="465" y="52">7</text>
  <text x="58" y="95">1</text><text x="58" y="155">2</text><text x="58" y="215">3</text><text x="58" y="275">4</text><text x="58" y="335">5</text><text x="58" y="395">6</text>
