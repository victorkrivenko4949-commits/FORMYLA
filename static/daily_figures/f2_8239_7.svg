<g class="small">
  <text x="535" y="155" fill="#FFD166">(6;2)</text>
  <text x="285" y="215" fill="#FFD166">(4;3)</text>
  <text x="285" y="462" fill="#EAF1FA">20 доминошек покрывают все 40 оставшихся клеток</text>
