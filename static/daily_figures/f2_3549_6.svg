<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" style="background-color:#0F1729"><rect x="0" y="0" width="600" height="500" fill="#0F1729"/><text x="300" y="42" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">Квадраты на сетке 4 × 4</text><g stroke="#A6B7CC" stroke-width="1.8" stroke-linecap="round"><line x1="160" y1="100" x2="400" y2="100"/><line x1="160" y1="180" x2="400" y2="180"/><line x1="160" y1="260" x2="400" y2="260"/><line x1="160" y1="340" x2="400" y2="340"/><line x1="160" y1="100" x2="160" y2="340"/><line x1="240" y1="100" x2="240" y2="340"/><line x1="320" y1="100" x2="320" y2="340"/><line x1="400" y1="100" x2="400" y2="340"/></g><g fill="#73B6E6" fill-opacity="0.06" stroke="#73B6E6" stroke-width="1.2"><rect x="160" y="100" width="160" height="160"/><rect x="240" y="100" width="160" height="160"/><rect x="160" y="180" width="160" height="160"/><rect x="240" y="180" width="160" height="160"/><rect x="160" y="100" width="240" height="240"/></g><g fill="none" stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="200,100 240,140 200,180 160,140"/><polygon points="280,100 320,140 280,180 240,140"/><polygon points="200,180 240,220 200,260 160,220"/><polygon points="280,180 320,220 280,260 240,220"/><polygon points="320,340 400,180 240,100 160,260"/><polygon points="240,340 400,260 320,100 160,180"/></g><g fill="#D9E5F5" stroke="#D9E5F5" stroke-width="1.8"><circle cx="160" cy="100" r="3.5"/><circle cx="240" cy="100" r="3.5"/><circle cx="320" cy="100" r="3.5"/><circle cx="400" cy="100" r="3.5"/><circle cx="160" cy="180" r="3.5"/><circle cx="240" cy="180" r="3.5"/><circle cx="320" cy="180" r="3.5"/><circle cx="400" cy="180" r="3.5"/><circle cx="160" cy="260" r="3.5"/><circle cx="240" cy="260" r="3.5"/><circle cx="320" cy="260" r="3.5"/><circle cx="400" cy="260" r="3.5"/><circle cx="160" cy="340" r="3.5"/><circle cx="240" cy="340" r="3.5"/><circle cx="320" cy="340" r="3.5"/><circle cx="400" cy="340" r="3.5"/></g><g fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round"><text x="470" y="112">Прямые квадраты:</text><text x="470" y="140">9 · 1×1</text><text x="470" y="166">4 · 2×2</text><text x="470" y="192">1 · 3×3</text><text x="470" y="236">Наклонные:</text><text x="470" y="264">4 · сторона √2</text><text x="470" y="290">2 · сторона √5</text><text x="470" y="352" font-size="16">Всего: 20</text></g><g stroke="#73B6E6" stroke-width="1.2" stroke-linecap="round"><line x1="425" y1="140" x2="445" y2="140"/><line x1="425" y1="166" x2="445" y2="166"/><line x1="425" y1="192" x2="445" y2="192"/><line x1="425" y1="264" x2="445" y2="264"/><line x1="425" y1="290" x2="445" y2="290"/></g></svg>