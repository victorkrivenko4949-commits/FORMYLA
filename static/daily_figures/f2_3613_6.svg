<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500"><rect x="0" y="0" width="600" height="500" fill="#0F1729"/><text x="300" y=" thirty" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">Квадраты на сетке 4×4</text><g stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"><line x1="55" y1="75" x2="365" y2="75"/><line x1="55" y1="152.5" x2="365" y2="152.5"/><line x1="55" y1="230" x2="365" y2="230"/><line x1="55" y1="307.5" x2="365" y2="307.5"/><line x1="55" y1="385" x2="365" y2="385"/><line x1="55" y1="75" x2="55" y2="385"/><line x1="132.5" y1="75" x2="132.5" y2="385"/><line x1="210" y1="75" x2="210" y2="385"/><line x1="287.5" y1="75" x2="287.5" y2="385"/><line x1="365" y1="75" x2="365" y2="385"/></g><g fill="#D9E5F5" stroke="#D9E5F5" stroke-width="1.8"><circle cx="55" cy="75" r="3.5"/><circle cx="132.5" cy="75" r="3.5"/><circle cx="210" cy="75" r="3.5"/><circle cx="287.5" cy="75" r="3.5"/><circle cx="365" cy="75" r="3.5"/><circle cx="55" cy="152.5" r="3.5"/><circle cx="132.5" cy="152.5" r="3.5"/><circle cx="210" cy="152.5" r="3.5"/><circle cx="287.5" cy="152.5" r="3.5"/><circle cx="365" cy="152.5" r="3.5"/><circle cx="55" cy="230" r="3.5"/><circle cx="132.5" cy="230" r="3.5"/><circle cx="210" cy="230" r="3.5"/><circle cx="287.5" cy="230" r="3.5"/><circle cx="365" cy="230" r="3.5"/><circle cx="55" cy="307.5" r="3.5"/><circle cx="132.5" cy="307.5" r="3.5"/><circle cx="210" cy="307.5" r="3.5"/><circle cx="287.5" cy="307.5" r="3.5"/><circle cx="365" cy="307.5" r="3.5"/><circle cx="55" cy="385" r="3.5"/><circle cx="132.5" cy="385" r="3.5"/><circle cx="210" cy="385" r="3.5"/><circle cx="287.5" cy="385" r="3.5"/><circle cx="365" cy="385" r="3.5"/></g><g fill="none" stroke="#73B6E6" stroke-width="2.2" stroke-linecap="round"><path d="M132.5 75 L287.5 152.5 L210 307.5 L55 230 Z"/><path d="M132.5 75 L287.5 75 L287.5 307.5 L55 307.5 L55 75 Z" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M132.5 230 L210 307.5 L132.5 385 L55 307.5 Z" opacity="0.8"/></g><g fill="#A6B7CC"><circle cx="132.5" cy="75" r="3.5"/><circle cx="287.5" cy="152.5" r="3.5"/><circle cx="210" cy="307.5" r="3.5"/><circle cx="55" cy="230" r="3.5"/></g><g fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round"><text x="210" y="430">4×4 клеточная сетка</text><text x="420" y="76" text-anchor="start" font-size="16">Прямые квадраты</text><text x="420" y="108" text-anchor="start">1×1: 4² = 16</text><text x="420" y="132" text-anchor="start">2×2: 3² = 9</text><text x="420" y="156" text-anchor="start">3×3: 2² = 4</text><text x="420" y="180" text-anchor="start">4×4: 1² = 1</text><text x="420" y="207" text-anchor="start" font-size="14">Итого: 30</text><text x="420" y="250" text-anchor="start" font-size="16">Наклонные квадраты</text><text x="420" y="282" text-anchor="start">w = 2: 3²·1 = 9</text><text x="420" y="306" text-anchor="start">w = 3: 2²·2 = 8</text><text x="420" y="330" text-anchor="start">w = 4: 1²·3 = 3</text><text x="420" y="357" text-anchor="start" font-size="14">Итого: 20</text><text x="420" y="402" text-anchor="start" font-size="18">Всего: 30 + 20 = 50</text><text x="420" y="440" text-anchor="start" fill="#73B6E6">наклонные квадраты</text><text x="420" y="462" text-anchor="start" fill="#73B6E6">пунктир — охватывающий квадрат</text></g></svg>