<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500"><rect width="600" height="500" fill="#0F1729"/><g font-family="Arial, Helvetica, sans-serif" fill="#EAF1FA" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round"><text x="300" y=" thirty" font-size="18">Замощение полоски 1×10</text><text x="300" y="55" font-size="12">Плитки 1×1 и 1×2</text></g><g stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"><rect x="60" y="85" width="480" height="48" fill="#182640"/><line x1="108" y1="85" x2="108" y2="133"/><line x1="156" y1="85" x2="156" y2="133"/><line x1="204" y1="85" x2="204" y2="133"/><line x1="252" y1="85" x2="252" y2="133"/><line x1="300" y1="85" x2="300" y2="133"/><line x1="348" y1="85" x2="348" y2="133"/><line x1="396" y1="85" x2="396" y2="133"/><line x1="444" y1="85" x2="444" y2="133"/><line x1="492" y1="85" x2="492" y2="133"/></g><g font-family="Arial, Helvetica, sans-serif" fill="#EAF1FA" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round"><text x="300" y="145" font-size="12">10 клеток</text><text x="84" y="75" font-size="12">1×1</text><text x="132" y="75" font-size="12">1×1</text></g><g stroke="#73B6E6" stroke-width="1.2" stroke-dasharray="4 4" fill="none"><path d="M60 155v10M60 160h48M108 155v10"/><path d="M108 155v10M108 160h432M540 155v10"/><path d="M60 355v10M60 360h48M108 355v10"/><path d="M108 355v10M108 360h384M492 355v10"/><path d="M60 395v10M60 400h96M156 395v10"/><path d="M156 395v10M156 400h384M540 395v10"/></g><g font-family="Arial, Helvetica, sans-serif" fill="#EAF1FA" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round"><text x="84" y="178" font-size="12">1×1</text><text x="324" y="178" font-size="12">осталось 9 клеток</text><text x="300" y="210" font-size="14">1-й случай: первая клетка покрыта плиткой 1×1</text></g><g stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"><rect x="60" y="230" width="480" height="48" fill="#182640"/><line x1="108" y1="230" x2="108" y2="278"/><line x1="156" y1="230" x2="156" y2="278"/><line x1="204" y1="230" x2="204" y2="278"/><line x1="252" y1="230" x2="252" y2="278"/><line x1="300" y1="230" x2="300" y2="278"/><line x1="348" y1="230" x2="348" y2="278"/><line x1="396" y1="230" x2="396" y2="278"/><line x1="444" y1="230" x2="444" y2="278"/><line x1="492" y1="230" x2="492" y2="278"/><rect x="60" y="230" width="96" height="48" fill="#244B69" stroke="#73B6E6" stroke-width="1.8"/></g><g font-family="Arial, Helvetica, sans-serif" fill="#EAF1FA" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round"><text x="108" y="254" font-size="12">1×2</text><text x="300" y="304" font-size="12">осталось 8 клеток</text><text x="300" y="336" font-size="14">2-й случай: первые две клетки покрыты плиткой 1×2</text><text x="108" y="380" font-size="12">aₙ = aₙ₋₁ + aₙ₋₂</text><text x="108" y="420" font-size="12">a₁ = 1,  a₂ = 2</text><text x="348" y="420" font-size="12">a₁₀ = 55 + 34 = 89</text><text x="300" y="468" font-size="18">Ответ: 89 способов</text></g><g stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"><rect x="60" y="430" width="96" height="28" fill="#182640"/><rect x="156" y="430" width="96" height="28" fill="#182640"/><rect x="252" y="430" width="96" height="28" fill="#182640"/><rect x="348" y="430" width="96" height="28" fill="#182640"/><rect x="444" y="430" width="96" height="28" fill="#182640"/></g><g font-family="Arial, Helvetica, sans-serif" fill="#EAF1FA" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round"><text x="108" y="444" font-size="12">1</text><text x="204" y="444" font-size="12">2</text><text x="300" y="444" font-size="12">3</text><text x="396" y="444" font-size="12">5</text><text x="492" y="444" font-size="12">8</text></g></svg>