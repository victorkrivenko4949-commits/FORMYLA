<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500"><rect width="600" height="500" fill="#0F1729"/><style>.txt{font-family:Arial,Helvetica,sans-serif;fill:#EAF1FA;text-anchor:middle;dominant-baseline:central;paint-order:stroke fill;stroke:#0F1729;stroke-width:2;stroke-linejoin:round}.v{font-size:14px}.n{font-size:12px}.tile{stroke:#D9E5F5;stroke-width:1.8;stroke-linecap:round}.aux{stroke:#73B6E6;stroke-width:1.2;stroke-dasharray:4 4;fill:none}</style><text class="txt v" x="300" y="25">Пример укладки 21 полоски 1×3</text><text class="txt n" x="300" y="47">Непокрытая клетка: (3,3)</text><g class="txt n"><text x="77.5" y="58">1</text><text x="122.5" y="58">2</text><text x="167.5" y="58">3</text><text x="212.5" y="58">4</text><text x="257.5" y="58">5</text><text x="302.5" y="58">6</text><text x="347.5" y="58">7</text><text x="392.5" y="58">8</text><text x="40" y="92.5">1</text><text x="40" y="137.5">2</text><text x="40" y="182.5">3</text><text x="40" y="227.5">4</text><text x="40" y="272.5">5</text><text x="40" y="317.5">6</text><text x="40" y="362.5">7</text><text x="40" y="407.5">8</text></g><g><rect class="tile" x="55" y="70" width="135" height="45" rx="3" fill="#355C7D"/><rect class="tile" x="190" y="70" width="135" height="45" rx="3" fill="#6C5B7B"/><rect class="tile" x="325" y="70" width="45" height="135" rx="3" fill="#C06C84"/><rect class="tile" x="370" y="70" width="45" height="135" rx="3" fill="#F67280"/><rect class="tile" x="55" y="115" width="135" height="45" rx="3" fill="#2A9D8F"/><rect class="tile" x="190" y="115" width="135" height="45" rx="3" fill="#457B9D"/><rect class="tile" x="55" y="160" width="45" height="135" rx="3" fill="#8AB17D"/><rect class="tile" x="100" y="160" width="45" height="135" rx="3" fill="#E9C46A"/><rect class="tile" x="190" y="160" width="135" height="45" rx="3" fill="#F4A261"/><rect class="tile" x="145" y="205" width="135" height="45" rx="3" fill="#E76F51"/><rect class="tile" x="280" y="205" width="135" height="45" rx="3" fill="#577590"/><rect class="tile" x="145" y="250" width="135" height="45" rx="3" fill="#43AA8B"/><rect class="tile" x="280" y="250" width="135" height="45" rx="3" fill="#90BE6D"/><rect class="tile" x="55" y="295" width="135" height="45" rx="3" fill="#F9C74F"/><rect class="tile" x="190" y="295" width="135" height="45" rx="3" fill="#F9844A"/><rect class="tile" x="325" y="295" width="45" height="135" rx="3" fill="#4D908E"/><rect class="tile" x="370" y="295" width="45" height="135" rx="3" fill="#277DA1"/><rect class="tile" x="55" y="340" width="135" height="45" rx="3" fill="#B56576"/><rect class="tile" x="190" y="340" width="135" height="45" rx="3" fill="#6D597A"/><rect class="tile" x="55" y="385" width="135" height="45" rx="3" fill="#386641"/><rect class="tile" x="190" y="385" width="135" height="45" rx="3" fill="#BC6C25"/></g><g class="txt v"><text x="122.5" y="92.5">a</text><text x="257.5" y="92.5">b</text><text x="347.5" y="137.5">c</text><text x="392.5" y="137.5">d</text><text x="122.5" y="137.5">e</text><text x="257.5" y="137.5">f</text><text x="77.5" y="227.5">g</text><text x="122.5" y="227.5">h</text><text x="257.5" y="182.5">i</text><text x="212.5" y="227.5">j</text><text x="347.5" y="227.5">k</text><text x="212.5" y="272.5">l</text><text x="347.5" y="272.5">m</text><text x="122.5" y="317.5">n</text><text x="257.5" y="317.5">o</text><text x="347.5" y="362.5">p</text><text x="392.5" y="362.5">q</text><text x="122.5" y="362.5">r</text><text x="257.5" y="362.5">s</text><text x="122.5" y="407.5">t</text><text x="257.5" y="407.5">u</text></g><g stroke="#D9E5F5" stroke-width="0.7" opacity="0.35"><path d="M100 70V430M145 70V430M190 70V430M235 70V430M280 70V430M325 70V430M370 70V430M55 115H415M55 160H415M55 205H415M55 250H415M55 295H415M55 340H415M55 385H415"/></g><rect x="145" y="160" width="45" height="45" fill="#0F1729" stroke="#FFD166" stroke-width="2.5"/><path d="M153 168L182 197M182 168L153 197" stroke="#FFD166" stroke-width="1.8" stroke-linecap="round"/><text class="txt n" x="167.5" y="215">единственная</text><text class="txt n" x="167.5" y="229">непокрытая</text><g transform="translate(445 75)"><text class="txt v" x="70" y="0">Почему только 4?</text><text class="txt n" x="70" y="27">A=(r+c) mod 3</text><g stroke="#D9E5F5" stroke-width="1.2"><rect x="22" y="42" width="28" height="28" fill="#355C7D"/><rect x="50" y="42" width="28" height="28" fill="#E9C46A"/><rect x="78" y="42" width="28" height="28" fill="#E76F51"/></g><g class="txt n"><text x="36" y="56">0</text><text x="64" y="56">1</text><text x="92" y="56">2</text></g><text class="txt n" x="70" y="88">B=(r−c) mod 3</text><g stroke="#D9E5F5" stroke-width="1.2"><rect x="22" y="103" width="28" height="28" fill="#355C7D"/><rect x="50" y="103" width="28" height="28" fill="#E9C46A"/><rect x="78" y="103" width="28" height="28" fill="#E76F51"/></g><g class="txt n"><text x="36" y="117">0</text><text x="64" y="117">1</text><text x="92" y="117">2</text></g><text class="txt n" x="70" y="153">Каждая полоска содержит</text><text class="txt n" x="70" y="170">по одной клетке каждого цвета.</text><text class="txt n" x="70" y="198">На доске: 22 клетки цвета 0</text><text class="txt n" x="70" y="215">и по 21 цвета 1 и 2.</text><text class="txt n" x="70" y="243">Значит, отверстие имеет</text><text class="txt n" x="70" y="260">A=0 и B=0, то есть</text><text class="txt v" x="70" y="285">r,c ∈ {3,6}</text><g transform="translate(22 310)"><rect x="0" y="0" width="96" height="96" fill="none" stroke="#D9E5F5" stroke-width="1.8"/><path class="aux" d="M24 0V96M48 0V96M72 0V96M0 24H96M0 48H96M0 72H96"/><circle cx="30" cy="30" r="5" fill="#FFD166"/><circle cx="66" cy="30" r="5" fill="#FFD166"/><circle cx="30" cy="66" r="5" fill="#FFD166"/><circle cx="66" cy="66" r="5" fill="#FFD166"/></g><text class="txt n" x="70" y="425">(3,3), (3,6), (6,3), (6,6)</text></g></svg>