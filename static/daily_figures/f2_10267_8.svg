<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500"><rect x="0" y="0" width="600" height="500" fill="#0F1729"/><text x="300" y="30" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">Квадраты на решётке 5×5 узлов</text><g stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round" opacity="0.72"><line x1="80" y1="90" x2="360" y2="90"/><line x1="80" y1="160" x2="360" y2="160"/><line x1="80" y1="230" x2="360" y2="230"/><line x1="80" y1="300" x2="360" y2="300"/><line x1="80" y1="370" x2="360" y2="370"/><line x1="80" y1="90" x2="80" y2="370"/><line x1="150" y1="90" x2="150" y2="370"/><line x1="220" y1="90" x2="220" y2="370"/><line x1="290" y1="90" x2="290" y2="370"/><line x1="360" y1="90" x2="360" y2="370"/></g><g fill="#D9E5F5" stroke="#D9E5F5" stroke-width="1.8"><circle cx="80" cy="90" r="3.5"/><circle cx="150" cy="90" r="3.5"/><circle cx="220" cy="90" r="3.5"/><circle cx="290" cy="90" r="3.5"/><circle cx="360" cy="90" r="3.5"/><circle cx="80" cy="160" r="3.5"/><circle cx="150" cy="160" r="3.5"/><circle cx="220" cy="160" r="3.5"/><circle cx="290" cy="160" r="3.5"/><circle cx="360" cy="160" r="3.5"/><circle cx="80" cy="230" r="3.5"/><circle cx="150" cy="230" r="3.5"/><circle cx="220" cy="230" r="3.5"/><circle cx="290" cy="230" r="3.5"/><circle cx="360" cy="230" r="3.5"/><circle cx="80" cy="300" r="3.5"/><circle cx="150" cy="300" r="3.5"/><circle cx="220" cy="300" r="3.5"/><circle cx="290" cy="300" r="3.5"/><circle cx="360" cy="300" r="3.5"/><circle cx="80" cy="370" r="3.5"/><circle cx="150" cy="370" r="3.5"/><circle cx="220" cy="370" r="3.5"/><circle cx="290" cy="370" r="3.5"/><circle cx="360" cy="370" r="3.5"/></g><g fill="none" stroke="#D9E5F5" stroke-width="3" stroke-linecap="round" opacity="0.95"><path d="M80 230 L220 230 L220 370 L80 370 Z"/><path d="M220 370 L290 230 L150 160 L80 300 Z"/><path d="M290 370 L360 160 L150 90 L80 300 Z"/><path d="M220 370 L360 230 L220 90 L80 230 Z"/></g><g fill="none" stroke="#73B6E6" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.9"><rect x="80" y="230" width="140" height="140"/><rect x="80" y="90" width="280" height="280"/></g><g fill="#A6B7CC" stroke="#A6B7CC" stroke-width="1.2"><circle cx="80" cy="230" r="2.5"/><circle cx="220" cy="230" r="2.5"/><circle cx="220" cy="370" r="2.5"/><circle cx="80" cy="370" r="2.5"/></g><g fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round"><text x="150" y="388">сторона 2</text><text x="247" y="306">(1, 2)</text><text x="245" y="150">(1, 3)</text><text x="287" y="235">(2, 2)</text></g><g transform="translate(400 75)"><text x="0" y="0" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">По сторонам сетки</text><text x="0" y="30" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">4² + 3² + 2² + 1² = 30</text><line x1="0" y1="54" x2="165" y2="54" stroke="#73B6E6" stroke-width="1.2" stroke-dasharray="4 4"/><text x="0" y="78" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">Наклонные</text><text x="0" y="108" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">(1,1): 1·3² = 9</text><text x="0" y="134" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">(1,2),(2,1): 2·2² = 8</text><text x="0" y="160" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">(1,3),(2,2),(3,1): 3·1² = 3</text><line x1="0" y1="185" x2="165" y2="185" stroke="#73B6E6" stroke-width="1.2" stroke-dasharray="4 4"/><text x="0" y="214" fill="#FFD166" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="start" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">Итого: 30 + 20 = 50</text></g><text x="220" y="430" fill="#A6B7CC" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">Примеры наклонных квадратов</text></svg>