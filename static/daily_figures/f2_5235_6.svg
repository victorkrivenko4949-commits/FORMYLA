<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500"><rect width="600" height="500" fill="#0F1729"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#73B6E6" stroke-width="1.2"/></marker></defs><g font-family="Arial, Helvetica, sans-serif" fill="#EAF1FA" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round"><text x="100" y=" thirty" font-size="14">1. Исходный квадрат</text><text x="300" y="30" font-size="14">2. После 1-го разреза</text><text x="500" y="30" font-size="14">3. Получены 5 полос</text><text x="100" y="260" font-size="14">4. Разрезаем поперёк</text><text x="300" y="260" font-size="14">5. Ещё один разрез</text><text x="500" y="260" font-size="14">6. Все клетки отделены</text></g><g stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round" fill="none"><!-- panel 1 --><rect x="45" y="55" width="100" height="100"/><path d="M65 55V155 M85 55V155 M105 55V155 M125 55V155 M45 75H145 M45 95H145 M45 115H145 M45 135H145"/><line x1="85" y1="50" x2="85" y2="160" stroke="#FFD166" stroke-width="2.2"/><circle cx="45" cy="55" r="3.5" fill="#D9E5F5"/><circle cx="145" cy="55" r="3.5" fill="#D9E5F5"/><circle cx="45" cy="155" r="3.5" fill="#D9E5F5"/><circle cx="145" cy="155" r="3.5" fill="#D9E5F5"/><!-- panel 2 --><rect x="225" y="55" width="40" height="100"/><rect x="265" y="55" width="60" height="100"/><path d="M225 75H265 M225 95H265 M225 115H265 M225 135H265 M265 75H325 M265 95H325 M265 115H325 M265 135H325"/><line x1="245" y1="50" x2="245" y2="160" stroke="#FFD166" stroke-width="2.2"/><line x1="285" y1="50" x2="285" y2="160" stroke="#FFD166" stroke-width="2.2"/><path d="M238 42H292" stroke="#73B6E6" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow)"/><line x1="265" y1="45" x2="265" y2="165" stroke="#73B6E6" stroke-width="1.2" stroke-dasharray="4 4"/><circle cx="225" cy="55" r="3.5" fill="#D9E5F5"/><circle cx="325" cy="55" r="3.5" fill="#D9E5F5"/><circle cx="225" cy="155" r="3.5" fill="#D9E5F5"/><circle cx="325" cy="155" r="3.5" fill="#D9E5F5"/><!-- panel 3 --><path d="M420 55V155 M440 55V155 M460 55V155 M480 55V155 M500 55V155 M520 55V155"/><path d="M420 55H520 M420 75H520 M420 95H520 M420 115H520 M420 135H520 M420 155H520"/><path d="M420 50H520" stroke="#73B6E6" stroke-width="1.2" stroke-dasharray="4 4"/><circle cx="420" cy="55" r="3.5" fill="#D9E5F5"/><circle cx="520" cy="55" r="3.5" fill="#D9E5F5"/><circle cx="420" cy="155" r="3.5" fill="#D9E5F5"/><circle cx="520" cy="155" r="3.5" fill="#D9E5F5"/><!-- panel 4 --><path d="M420 285V385 M440 285V385 M460 285V385 M480 285V385 M500 285V385 M520 285V385 M420 285H520 M420 305H520 M420 325H520 M420 345H520 M420 365H520 M420 385H520"/><line x1="420" y1="325" x2="520" y2="325" stroke="#FFD166" stroke-width="2.2"/><path d="M415 325H525" stroke="#FFD166" stroke-width="1.2" stroke-dasharray="4 4"/><circle cx="420" cy="285" r="3.5" fill="#D9E5F5"/><circle cx="520" cy="285" r="3.5" fill="#D9E5F5"/><circle cx="420" cy="385" r="3.5" fill="#D9E5F5"/><circle cx="520" cy="385" r="3.5" fill="#D9E5F5"/><!-- panel 5 --><path d="M220 285V385 M240 285V385 M260 285V385 M280 285V385 M300 285V385 M320 285V385 M220 285H320 M220 305H320 M220 325H320 M220 345H320 M220 365H320 M220 385H320"/><path d="M220 305H320 M220 325H320 M220 345H320" stroke="#FFD166" stroke-width="2.2"/><circle cx="220" cy="285" r="3.5" fill="#D9E5F5"/><circle cx="320" cy="285" r="3.5" fill="#D9E5F5"/><circle cx="220" cy="385" r="3.5" fill="#D9E5F5"/><circle cx="320" cy="385" r="3.5" fill="#D9E5F5"/><!-- panel 6 --><path d="M420 285H520 M420 305H520 M420 325H520 M420 345H520 M420 365H520 M420 385H520 M420 285V385 M440 285V385 M460 285V385 M480 285V385 M500 285V385 M520 285V385"/><circle cx="420" cy="285" r="3.5" fill="#D9E5F5"/><circle cx="520" cy="285" r="3.5" fill="#D9E5F5"/><circle cx="420" cy="385" r="3.5" fill="#D9E5F5"/><circle cx="520" cy="385" r="3.5" fill="#D9E5F5"/></g><g font-family="Arial, Helvetica, sans-serif" fill="#EAF1FA" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round"><text x="100" y="175" font-size="12">5×5</text><text x="75" y="168" font-size="12">5×2</text><text x="295" y="168" font-size="12">5×3</text><text x="275" y="48" font-size="12">складываем</text><text x="470" y="175" font-size="12">5 полос 1×5</text><text x="470" y="405" font-size="12">2+3</text><text x="270" y="405" font-size="12">1+1+1+2</text><text x="470" y="405" font-size="12">25 клеток 1×1</text><text x="300" y="438" font-size="12" fill="#A6B7CC">Нижняя оценка: после 1-го разреза площади ≤16, поэтому остаются 5×2 и 5×3;</text><text x="300" y="457" font-size="12" fill="#A6B7CC">но 5×3 нельзя вторым разрезом разделить на 7 и 8. Значит, 5 разрезов недостаточно.</text><text x="300" y="480" font-size="14" fill="#FFD166">Минимум: 6 разрезов</text></g></svg>