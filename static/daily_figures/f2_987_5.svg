<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500"><rect x="0" y="0" width="600" height="500" fill="#0F1729"/><text x="300" y="32" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">Клетки двух диагоналей в квадрате 7×7</text><g fill="#F6B44C" opacity="0.82"><rect x="125" y="70" width="50" height="50"/><rect x="175" y="120" width="50" height="50"/><rect x="225" y="170" width="50" height="50"/><rect x="275" y="220" width="50" height="50"/><rect x="325" y="270" width="50" height="50"/><rect x="375" y="320" width="50" height="50"/><rect x="425" y="370" width="50" height="50"/><rect x="425" y="70" width="50" height="50"/><rect x="375" y="120" width="50" height="50"/><rect x="325" y="170" width="50" height="50"/><rect x="275" y="220" width="50" height="50"/><rect x="225" y="270" width="50" height="50"/><rect x="175" y="320" width="50" height="50"/><rect x="125" y="370" width="50" height="50"/></g><g stroke="#73B6E6" stroke-width="1.2" stroke-dasharray="4 4" stroke-linecap="round" fill="none"><line x1="125" y1="70" x2="475" y2="420"/><line x1="475" y1="70" x2="125" y2="420"/></g><g stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round" fill="none"><rect x="125" y="70" width="350" height="350"/><line x1="175" y1="70" x2="175" y2="420"/><line x1="225" y1="70" x2="225" y2="420"/><line x1="275" y1="70" x2="275" y2="420"/><line x1="325" y1="70" x2="325" y2="420"/><line x1="375" y1="70" x2="375" y2="420"/><line x1="425" y1="70" x2="425" y2="420"/><line x1="125" y1="120" x2="475" y2="120"/><line x1="125" y1="170" x2="475" y2="170"/><line x1="125" y1="220" x2="475" y2="220"/><line x1="125" y1="270" x2="475" y2="270"/><line x1="125" y1="320" x2="475" y2="320"/><line x1="125" y1="370" x2="475" y2="370"/></g><text x="300" y="458" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">7 + 7 − 1 = 13</text><text x="300" y="480" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">Центральная клетка принадлежит обеим диагоналям</text></svg>