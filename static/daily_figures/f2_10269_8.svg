<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500"><rect x="0" y="0" width="600" height="500" fill="#0F1729"/><defs><pattern id="checker" patternUnits="userSpaceOnUse" x="70" y="50" width="80" height="80"><rect x="0" y="0" width="40" height="40" fill="#6B819B"/><rect x="40" y="0" width="40" height="40" fill="#B7C8D8"/><rect x="0" y="40" width="40" height="40" fill="#B7C8D8"/><rect x="40" y="40" width="40" height="40" fill="#6B819B"/></pattern><style> .label{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#EAF1FA;text-anchor:middle;dominant-baseline:central;paint-order:stroke fill;stroke:#0F1729;stroke-width:2;stroke-linejoin:round}.small{font-size:12px}.grid{stroke:#D9E5F5;stroke-width:1.8;stroke-linecap:round;fill:none}</style></defs><text x="270" y="25" class="label">Шахматная раскраска квадрата 10 × 10</text><rect x="70" y="50" width="400" height="400" fill="url(#checker)" stroke="#D9E5F5" stroke-width="1.8"/><path class="grid" d="M110 50V450 M150 50V450 M190 50V450 M230 50V450 M270 50V450 M310 50V450 M350 50V450 M390 50V450 M430 50V450 M70 90H470 M70 130H470 M70 170H470 M70 210H470 M70 250H470 M70 290H470 M70 330H470 M70 370H470 M70 410H470"/><text x="270" y="470" class="label">10 × 10 = 100 клеток</text><text x="70" y="30" class="label small">50</text><text x="470" y="30" class="label small">50</text><text x="70" y="465" class="label small">чёрных</text><text x="470" y="465" class="label small">белых</text><path d="M485 50V450" stroke="#73B6E6" stroke-width="1.2" stroke-dasharray="4 4"/><text x="540" y="30" class="label small">Пример T</text><rect x="495" y="75" width="22" height="22" fill="#6B819B" stroke="#D9E5F5" stroke-width="1.2"/><rect x="517" y="75" width="22" height="22" fill="#B7C8D8" stroke="#D9E5F5" stroke-width="1.2"/><rect x="539" y="75" width="22" height="22" fill="#6B819B" stroke="#D9E5F5" stroke-width="1.2"/><rect x="517" y="97" width="22" height="22" fill="#6B819B" stroke="#D9E5F5" stroke-width="1.2"/><path d="M495 75H561V97H539V119H517V97H495Z" fill="none" stroke="#FFD166" stroke-width="1.8" stroke-linejoin="round"/><text x="528" y="140" class="label small">3 чёрные +</text><text x="528" y="157" class="label small">1 белая</text><text x="528" y="190" class="label small">25 фигур</text><text x="528" y="212" class="label small">дают 100 клеток</text><path d="M495 235H570" stroke="#73B6E6" stroke-width="1.2" stroke-dasharray="4 4"/><text x="532" y="260" class="label small">Пусть k фигур</text><text x="532" y="278" class="label small">покрывают 3 чёрные:</text><text x="532" y="305" class="label small">3k + (25−k) = 50</text><text x="532" y="330" class="label small">2k + 25 = 50</text><text x="532" y="355" class="label small">k = 12,5</text><text x="532" y="390" class="label small" fill="#FFD166">невозможно</text></svg>