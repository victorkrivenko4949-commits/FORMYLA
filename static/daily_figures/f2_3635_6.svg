<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500">
<rect x="0" y="0" width="600" height="500" fill="#0F1729"/>
<text x="300" y="25" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">Маршрут шахматного коня</text>
<!-- шахматная доска: координаты x=0,...,3, y=0,...,3 -->
<g stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round">
  <rect x="70" y="50" width="400" height="400" fill="#17233A" stroke="none"/>
  <rect x="70" y="50" width="100" height="100" fill="#22304A" stroke="none"/>
  <rect x="270" y="50" width="100" height="100" fill="#22304A" stroke="none"/>
  <rect x="170" y="150" width="100" height="100" fill="#22304A" stroke="none"/>
  <rect x="370" y="150" width="100" height="100" fill="#22304A" stroke="none"/>
  <rect x="70" y="250" width="100" height="100" fill="#22304A" stroke="none"/>
  <rect x="270" y="250" width="100" height="100" fill="#22304A" stroke="none"/>
  <rect x="170" y="350" width="100" height="100" fill="#22304A" stroke="none"/>
  <rect x="370" y="350" width="100" height="100" fill="#22304A" stroke="none"/>
  <path d="M70 50H470M70 150H470M70 250H470M70 350H470M70 450H470M70 50V450M170 50V450M270 50V450M370 50V450M470 50V450" fill="none"/>
</g>
<!-- выделенные клетки -->
<rect x="70" y="350" width="100" height="100" fill="#F6B44C" fill-opacity="0.16" stroke="#F6B44C" stroke-width="2.4"/>
<rect x="170" y="150" width="100" height="100" fill="#73B6E6" fill-opacity="0.18" stroke="#73B6E6" stroke-width="2.4"/>
<rect x="370" y="50" width="100" height="100" fill="#F6B44C" fill-opacity="0.2" stroke="#F6B44C" stroke-width="2.4"/>
<!-- маршрут двумя ходами -->
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L9,4.5 L0,9 Z" fill="#F6B44C"/>
  </marker>
</defs>
<path d="M120 400 L220 200 L420 100" fill="none" stroke="#F6B44C" stroke-width="3" stroke-linecap="round" marker-mid="url(#arrow)" marker-end="url(#arrow)"/>
<!-- точки -->
<circle cx="120" cy="400" r="3.5" fill="#F6B44C" stroke="#F6B44C" stroke-width="1.8"/>
<circle cx="220" cy="200" r="3.5" fill="#A6B7CC" stroke="#A6B7CC" stroke-width="1.8"/>
<circle cx="420" cy="100" r="3.5" fill="#F6B44C" stroke="#F6B44C" stroke-width="1.8"/>
<!-- координатные подписи осей -->
<g fill="#A6B7CC" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">
  <text x="120" y="468">0</text><text x="220" y="468">1</text><text x="320" y="468">2</text><text x="420" y="468">3</text>
  <text x="52" y="400">0</text><text x="52" y="300">1</text><text x="52" y="200">2</text><text x="52" y="100">3</text>
  <text x="490" y="468">x</text><text x="52" y="70">y</text>
</g>
<!-- подписи клеток и ходов -->
<g fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">
  <text x="120" y="425">(0;0)</text>
  <text x="220" y="178">(1;2)</text>
  <text x="420" y="76">(3;3)</text>
  <text x="155" y="292" fill="#FFD28A">1-й ход</text>
  <text x="320" y="137" fill="#FFD28A">2-й ход</text>
</g>
<text x="300" y="485" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">(0;0) → (1;2) → (3;3), всего 2 хода</text>
</svg>