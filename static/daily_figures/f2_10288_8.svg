<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500"><rect x="0" y="0" width="600" height="500" fill="#0F1729"/><text x="300" y="42" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">Тетрамино: 5 различных фигур</text><text x="300" y="72" fill="#A6B7CC" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">Фигуры, получаемые поворотом или отражением, считаются одинаковыми</text><g fill="#24445F" stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"><rect x="58" y="126" width="30" height="30"/><rect x="88" y="126" width="30" height="30"/><rect x="118" y="126" width="30" height="30"/><rect x="148" y="126" width="30" height="30"/></g><text x="118" y="108" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">I — полоска</text><g fill="#24445F" stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"><rect x="268" y="118" width="30" height="30"/><rect x="298" y="118" width="30" height="30"/><rect x="268" y="148" width="30" height="30"/><rect x="298" y="148" width="30" height="30"/></g><text x="298" y="100" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">O — квадрат</text><g fill="#24445F" stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"><rect x="422" y="118" width="30" height="30"/><rect x="452" y="118" width="30" height="30"/><rect x="482" y="118" width="30" height="30"/><rect x="452" y="148" width="30" height="30"/></g><text x