<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500"><rect x="0" y="0" width="600" height="500" fill="#0F1729"/><g font-family="Arial, Helvetica, sans-serif" fill="#EAF1FA" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round"><text x="300" y="38" font-size="20">Квадраты нечётной длины</text><text x="210" y="68" font-size="14">Сетка 7×7 клеток</text></g><g stroke-linecap="round"><rect x="55" y="95" width="310" height="310" fill="#73B6E6" fill-opacity="0.06" stroke="#73B6E6" stroke-width="2.4"/><rect x="99.2857" y="139.2857" width="221.4286" height="221.4286" fill="#FFD166" fill-opacity="0.08" stroke="#FFD166" stroke-width="2.4"/><rect x="143.5714" y="183.5714" width="132.8572" height="132.8572" fill="#C084FC" fill-opacity="0.10" stroke="#C084FC" stroke-width="2.4"/><rect x="187.8571" y="227.8571" width="44.2858" height="44.2858" fill="#F78C6B" fill-opacity="0.16" stroke="#F78C6B" stroke-width="2.4"/></g><g stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"><line x1="55" y1="95" x2="55" y2="405"/><line x1="99.2857" y1="95" x2="99.2857" y2="405"/><line x1="143.5714" y1="95" x2="143.5714" y2="405"/><line x1="187.8571" y1="95" x2="187.8571" y2="405"/><line x1="232.1429" y1="95" x2="232.1429" y2="405"/><line x1="276.4286" y1="95" x2="276.4286" y2="405"/><line x1="320.7143" y1="95" x2="320.7143" y2="405"/><line x1="365" y1="95" x2="365" y2="405"/><line x1="55" y1="95" x2="365" y2="95"/><line x1="55" y1="139.2857" x2="365" y2="139.2857"/><line x1="55" y1="183.5714" x2="365" y2="183.5714"/><line x1="55" y1="227.8571" x2="365" y2="227.8571"/><line x1="55" y1="272.1429" x2="365" y2="272.1429"/><line x1="55" y1="316.4286" x2="365" y2="316.4286"/><line x1="55" y1="360.7143" x2="365" y2="360.7143"/><line x1="55" y1="405" x2="365" y2="405"/></g><g font-family="Arial, Helvetica, sans-serif" fill="#EAF1FA" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round"><text x="210" y="118" font-size="12">7 клеток</text><text x="210" y="151" font-size="12">5 клеток</text><text x="210" y="195" font-size="12">3 клетки</text><text x="210" y="250" font-size="12">1</text></g><g font-family="Arial, Helvetica, sans-serif" fill="#EAF1FA" text-anchor="start" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round"><text x="405" y="92" font-size="16">Нечётные стороны:</text><text x="405" y="125" font-size="14">k = 1, 3, 5, 7</text><line x1="405" y1="150" x2="555" y2="150" stroke="#73B6E6" stroke-width="1.2"/><text x="405" y="180" font-size="14">Для стороны k:</text><text x="405" y="207" font-size="13">(8 − k)² размещений</text><text x="405" y="247" font-size="13">1: 7² = 49</text><text x="405" y="275" font-size="13">3: 5² = 25</text><text x="405" y="303" font-size="13">5: 3² = 9</text><text x="405" y="331" font-size="13">7: 1² = 1</text><line x1="405" y1="354" x2="555" y2="354" stroke="#73B6E6" stroke-width="1.2"/><text x="405" y="386" font-size="16">Итого: 49 + 25 + 9 + 1</text><text x="480" y="428" font-size="22">84</text></g></svg>