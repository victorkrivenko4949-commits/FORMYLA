<text x="284" y="420" class="label num">столбцы →</text>
<text x="52" y="232" class="label num" transform="rotate(-90 52 232)">строки</text>
<!-- легенда -->
<rect x="500" y="120" width="18" height="18" fill="#286487" stroke="#D9E5F5" stroke-width="1.2"/>
<text x="558" y="129" class="label num">домино</text>
<rect x="500" y="153" width="18" height="18" fill="url(#cutPattern)" stroke="#E27D60" stroke-width="1.2"/>
<text x="558" y="162" class="label num">вырезанная клетка</text>
<text x="550" y="205" class="label num">Всего клеток: 42</text>
<text x="550" y="225" class="label num">Вырезано: 2</text>
<text x="550" y="245" class="label num">Осталось: 40</text>
</svg>