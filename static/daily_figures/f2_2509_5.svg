<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500">
<rect x="0" y="0" width="600" height="500" fill="#0F1729"/>
<defs>
  <pattern id="cutPattern" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="8" height="8" fill="#5B3040"/>
    <line x1="0" y1="0" x2="0" y2="8" stroke="#E27D60" stroke-width="2"/>
  </pattern>
  <style>
    .label{font-family:Arial,Helvetica,sans-serif;fill:#EAF1FA;text-anchor:middle;dominant-baseline:central;paint-order:stroke fill;stroke:#0F1729;stroke-width:2;stroke-linejoin:round}
    .num{font-size:12px}
    .tile{stroke:#D9E5F5;stroke-width:1.8;stroke-linejoin:round}
  </style>
</defs>
<text x="284" y="27" class="label" font-size="18px">Покрытие доски 6×7</text>
<text x="284" y="48" class="label num">20 доминошек покрывают все 40 оставшихся клеток</text>

<!-- шахматная доска -->
<rect x="95" y="70" width="378" height="324" fill="#17243A" stroke="#D9E5F5" stroke-width="1.8"/>
<!-- клетки доминошек -->
<g opacity="0.82">
  <rect class="tile" x="95" y="286" width="54" height="108" rx="4" fill="#286487"/>
  <rect class="tile" x="149" y="178" width="54" height="108" rx="4" fill="#B88728"/>
  <rect class="tile" x="419" y="286" width="54" height="108" rx="4" fill="#286487"/>
  <rect class="tile" x="149" y="286" width="54" height="108" rx="4" fill="#B88728"/>
