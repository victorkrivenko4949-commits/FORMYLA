  <rect class="tile" x="257" y="70" width="54" height="108" rx="4" fill="#B88728"/>
  <rect class="tile" x="257" y="178" width="54" height="108" rx="4" fill="#286487"/>
  <rect class="tile" x="257" y="286" width="54" height="108" rx="4" fill="#B88728"/>
  <rect class="tile" x="311" y="124" width="54" height="108" rx="4" fill="#B88728"/>
  <rect class="tile" x="311" y="70" width="108" height="54" rx="4" fill="#286487"/>
  <rect class="tile" x="365" y="124" width="54" height="108" rx="4" fill="#286487"/>
  <rect class="tile" x="365" y="232" width="54" height="108" rx="4" fill="#B88728"/>
  <rect class="tile" x="311" y="232" width="54" height="108" rx="4" fill="#286487"/>
  <rect class="tile" x="311" y="340" width="108" height="54" rx="4" fill="#B88728"/>
  <rect class="tile" x="95" y="70" width="54" height="108" rx="4" fill="#B88728"/>
  <rect class="tile" x="149" y="70" width="108" height="54" rx="4" fill="#286487"/>
  <rect class="tile" x="419" y="70" width="54" height="108" rx="4" fill="#B88728"/>
  <rect class="tile" x="95" y="178" width="54" height="108" rx="4" fill="#286487"/>
  <rect class="tile" x="419" y="178" width="54" height="108" rx="4" fill="#B88728"/>
</g>
<!-- сетка -->
<g fill="none" stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round" opacity="0.7">
  <path d="M149 70V394 M203 70V394 M257 70V394 M311 70V394 M365 70V394 M419 70V394"/>
  <path d="M95 124H473 M95 178H473 M95 232H473 M95 286H473 M95 340H473"/>
</g>
<!-- вырезанные клетки (6;3) и (5;3) -->
<rect x="203" y="286" width="54" height="54" fill="url(#cutPattern)" stroke="#E27D60" stroke-width="1.8"/>
<rect x="203" y="340" width="54" height="54" fill="url(#cutPattern)" stroke="#E27D60" stroke-width="1.8"/>
<text x="230" y="313" class="label num" fill="#FFD7C9">(5;3)</text>
<text x="230" y="367" class="label num" fill="#FFD7C9">(6;3)</text>

<!-- номера доминошек -->
<g class="label num" fill="#EAF1FA">
 <text x="122" y="340">1</text><text x="176" y="232">2</text><text x="446" y="340">3</text><text x="176" y="340">4</text>
 <text x="230" y="124">5</text><text x="230" y="232">6</text><text x="284" y="124">7</text><text x="284" y="232">8</text>
