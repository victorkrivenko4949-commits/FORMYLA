<g class="label num">
 <text x="122" y="57">1</text><text x="176" y="57">2</text><text x="230" y="57">3</text><text x="284" y="57">4</text><text x="338" y="57">5</text><text x="392" y="57">6</text><text x="446" y="57">7</text>
 <text x="78" y="97">1</text><text x="78" y="151">2</text><text x="78" y="205">3</text><text x="78" y="259">4</text><text x="78" y="313">5</text><text x="78" y="367">6</text>
