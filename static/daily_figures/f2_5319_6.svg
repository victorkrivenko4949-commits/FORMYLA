<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500">
<rect x="0" y="0" width="600" height="500" fill="#0F1729"/>
<defs>
  <pattern id="checker" width="110" height="110" patternUnits="userSpaceOnUse">
    <rect width="110" height="110" fill="#21364D"/>
    <rect width="55" height="55" fill="#2B4862"/>
    <rect x="55" y="55" width="55" height="55" fill="#2B4862"/>
  </pattern>
  <style>
    .label{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#EAF1FA;text-anchor:middle;dominant-baseline:central;paint-order:stroke fill;stroke:#0F1729;stroke-width:2;stroke-linejoin:round}
    .num{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#EAF1FA;text-anchor:middle;dominant-baseline:central;paint-order:stroke fill;stroke:#0F1729;stroke-width:2;stroke-linejoin:round}
  </style>
</defs>
<text x="300" y="30" class="label" font-size="18">Покрытие доски доминошками</text>
<text x="300" y="52" class="num">7 × 6 клеток; клетки (2;4) и (6;3) вырезаны</text>
<!-- шахматная доска -->
<rect x="90" y="80" width="385" height="330" fill="url(#checker)" stroke="#D9E5F5" stroke-width="1.8"/>
<!-- сетка -->
<path d="M145 80V410 M200 80V410 M255 80V410 M310 80V410 M365 80V410 M420 80V410 M90 135H475 M90 190H475 M90 245H475 M90 300H475 M90 355H475" fill="none" stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"/>
<!-- вырезанные клетки: (2;4), (6;3) -->
<rect x="145" y="245" width="55" height="55" fill="#633247" stroke="#FFD166" stroke-width="1.8"/>
<path d="M153 253L192 292 M192 253L153 292" stroke="#FFD166" stroke-width="1.8" stroke-linecap="round"/>
<rect x="365" y="190" width="55" height="55" fill="#633247" stroke="#FFD166" stroke-width="1.8"/>
<path d="M373 198L412 237 M412 198L373 237" stroke="#FFD166" stroke-width="1.8" stroke-linecap="round"/>
<!-- контуры 20 доминошек -->
<g fill="none" stroke="#73B6E6" stroke-width="2.4" stroke-linejoin="round">
  <rect x="310" y="80" width="110" height="55" rx="8"/>
  <rect x="200" y="135" width="110" height="55" rx="8"/>
  <rect x="310" y="135" width="110" height="55" rx="8"/>
  <rect x="90" y="190" width="110" height="55" rx="8"/>
  <rect x="200" y="190" width="110" height="55" rx="8"/>
  <rect x="420" y="190" width="55" height="110" rx="8"/>
  <rect x="310" y="190" width="55" height="110" rx="8"/>
  <rect x="200" y="245" width="110" height="55" rx="8"/>
  <rect x="365" y="245" width="55" height="110" rx="8"/>
  <rect x="145" y="245" width="55" height="110" rx="8"/>
  <rect x="145" y="300" width="110" height="55" rx="8"/>
  <rect x="90" y="355" width="110" height="55" rx="8"/>
  <rect x="420" y="300" width="55" height="110" rx="8"/>
  <rect x="200" y="355" width="110" height="55" rx="8"/>
  <rect x="255" y="300" width="110" height="55" rx="8"/>
  <rect x="310" y="355" width="110" height="55" rx="8"/>
  <rect x="90" y="80" width="110" height="55" rx="8"/>
  <rect x="90" y="135" width="110" height="55" rx="8"/>
  <rect x="420" y="80" width="55" height="110" rx="8"/>
  <rect x="200" y="80" width="110" height="55" rx="8"/>
</g>
<!-- номера столбцов и строк -->
<g class="num">
  <text x="117.5" y="68">1</text><text x="172.5" y="68">2</text><text x="227.5" y="68">3</text><text x="282.5" y="68">4</text><text x="337.5" y="68">5</text><text x="392.5" y="68">6</text><text x="447.5" y="68">7</text>
  <text x="75" y="107.5">1</text><text x="75" y="162.5">2</text><text x="75" y="217.5">3</text><text x="75" y="272.5">4</text><text x="75" y="327.5">5</text><text x="75" y="382.5">6</text>
</g>
<!-- пояснение -->
<rect x="90" y="445" width="18" height="18" rx="3" fill="none" stroke="#73B6E6" stroke-width="2.4"/>
<text x="118" y="454" class="num" text-anchor="start">доминошка</text>
<rect x="250" y="445" width="18" height="18" fill="#633247" stroke="#FFD166" stroke-width="1.5"/>
<path d="M253 448L265 460 M265 448L253 460" stroke="#FFD166" stroke-width="1.2"/>
<text x="278" y="454" class="num" text-anchor="start">вырезанная клетка</text>
<text x="300" y="482" class="label">40 оставшихся клеток = 20 доминошек</text>
</svg>