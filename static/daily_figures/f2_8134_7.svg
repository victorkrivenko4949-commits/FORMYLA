<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500"><rect x="0" y="0" width="600" height="500" fill="#0F1729"/><text x="300" y="42" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">Все возможные положения доминошки 1 × 2</text><text x="175" y="82" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">Горизонтально: 3 · 2 = 6</text><text x="425" y="82" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">Вертикально: 3 · 2 = 6</text><g stroke="#73B6E6" stroke-width="8" stroke-linecap="round" opacity="0.48"><line x1="105" y1="155" x2="175" y2="155"/><line x1="175" y1="155" x2="245" y2="155"/><line x1="105" y1="225" x2="175" y2="225"/><line x1="175" y1="225" x2="245" y2="225"/><line x1="105" y1="295" x2="175" y2="295"/><line x1="175" y1="295" x2="245" y2="295"/><line x1="375" y1="155" x2="375" y2="225"/><line x1="445" y1="155" x2="445" y2="225"/><line x1="515" y1="155" x2="515" y2="225"/><line x1="375" y1="225" x2="375" y2="295"/><line x1="445" y1="225" x2="445" y2="295"/><line x1="515" y1="225" x2="515" y2="295"/></g><g stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round" fill="none"><line x1="70" y1="120" x2="280" y2="120"/><line x1="70" y1="190" x2="280" y2="190"/><line x1="70" y1="260" x2="280" y2="260"/><line x1="70" y1="330" x2="280" y2="330"/><line x1="70" y1="120" x2="70" y2="330"/><line x1="140" y1="120" x2="140" y2="330"/><line x1="210" y1="120" x2="210" y2="330"/><line x1="280" y1="120" x2="280" y2="330"/><line x1="340" y1="120" x2="550" y2="120"/><line x1="340" y1="190" x2="550" y2="190"/><line x1="340" y1="260" x2="550" y2="260"/><line x1="340" y1="330" x2="550" y2="330"/><line x1="340" y1="120" x2="340" y2="330"/><line x1="410" y1="120" x2="410" y2="330"/><line x1="480" y1="120" x2="480" y2="330"/><line x1="550" y1="120" x2="550" y2="330"/></g><g fill="#A6B7CC" stroke="#D9E5F5" stroke-width="1.2"><circle cx="105" cy="155" r="3.5"/><circle cx="175" cy="155" r="3.5"/><circle cx="245" cy="155" r="3.5"/><circle cx="105" cy="225" r="3.5"/><circle cx="175" cy="225" r="3.5"/><circle cx="245" cy="225" r="3.5"/><circle cx="105" cy="295" r="3.5"/><circle cx="175" cy="295" r="3.5"/><circle cx="245" cy="295" r="3.5"/><circle cx="375" cy="155" r="3.5"/><circle cx="445" cy="155" r="3.5"/><circle cx="515" cy="155" r="3.5"/><circle cx="375" cy="225" r="3.5"/><circle cx="445" cy="225" r="3.5"/><circle cx="515" cy="225" r="3.5"/><circle cx="375" cy="295" r="3.5"/><circle cx="445" cy="295" r="3.5"/><circle cx="515" cy="295" r="3.5"/></g><text x="175" y="380" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">2 соседние клетки в каждом из 3 рядов</text><text x="425" y="380" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">2 соседние клетки в каждом из 3 столбцов</text><text x="300" y="445" fill="#FFD166" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">Итого: 6 + 6 = 12</text></svg>