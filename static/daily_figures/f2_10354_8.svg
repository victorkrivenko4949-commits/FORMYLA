<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" style="background-color:#0F1729"><rect x="0" y="0" width="600" height="500" fill="#0F1729"/><text x="300" y="42" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">Разрезание полоски длиной 10 клеток</text><text x="300" y="78" fill="#A6B7CC" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">Каждая часть имеет длину 1, 2 или 3 клетки</text><rect x="60" y="130" width="480" height="64" fill="#182640" stroke="#D9E5F5" stroke-width="1.8" rx="2"/><rect x="60" y="130" width="144" height="64" fill="#245276" opacity="0.72"/><rect x="204" y="130" width="96" height="64" fill="#315D78" opacity="0.72"/><rect x="300" y="130" width="48" height="64" fill="#426B80" opacity="0.72"/><rect x="348" y="130" width="144" height="64" fill="#315D78" opacity="0.72"/><rect x="492" y="130" width="48" height="64" fill="#426B80" opacity="0.72"/><g stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"><line x1="108" y1="130" x2="108" y2="194"/><line x1="156" y1="130" x2="156" y2="194"/><line x1="204" y1="130" x2="204" y2="194"/><line x1="252" y1="130" x2="252" y2="194"/><line x1="300" y1="130" x2="300" y2="194"/><line x1="348" y1="130" x2="348" y2="194"/><line x1="396" y1="130" x2="396" y2="194"/><line x1="444" y1="130" x2="444" y2="194"/><line x1="492" y1="130" x2="492" y2="194"/></g><g stroke="#73B6E6" stroke-width="1.2" stroke-dasharray="4 4"><line x1="204" y1="116" x2="204" y2="208"/><line x1="300" y1="116" x2="300" y2="208"/><line x1="348" y1="116" x2="348" y2="208"/><line x1="492" y1="116" x2="492" y2="208"/></g><g fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round"><text x="132" y="162">3 клетки</text><text x="252" y="162">2</text><text x="324" y="162">1</text><text x="420" y="162">3</text><text x="516" y="162">1</text></g><g fill="#A6B7CC" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round"><text x="60" y="218">0</text><text x="108" y="218">1</text><text x="156" y="218">2</text><text x="204" y="218">3</text><text x="252" y="218">4</text><text x="300" y="218">5</text><text x="348" y="218">6</text><text x="396" y="218">7</text><text x="444" y="218">8</text><text x="492" y="218">9</text><text x="540" y="218">10</text></g><text x="300" y="250" fill="#73B6E6" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">Пример: 3 + 2 + 1 + 3 + 1 = 10</text><text x="300" y="290" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">f(n) = f(n−1) + f(n−2) + f(n−3)</text><text x="300" y="320" fill="#A6B7CC" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">f(0)=1,  f(1)=1,  f(2)=2</text><g stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"><rect x="42" y="352" width="516" height="76" fill="#182640"/><line x1="42" y1="390" x2="558" y2="390"/><line x1="89" y1="352" x2="89" y2="428"/><line x1="136" y1="352" x2="136" y2="428"/><line x1="183" y1="352" x2="183" y2="428"/><line x1="230" y1="352" x2="230" y2="428"/><line x1="277" y1="352" x2="277" y2="428"/><line x1="324" y1="352" x2="324" y2="428"/><line x1="371" y1="352" x2="371" y2="428"/><line x1="418" y1="352" x2="418" y2="428"/><line x1="465" y1="352" x2="465" y2="428"/><line x1="512" y1="352" x2="512" y2="428"/></g><g fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round"><text x="65" y="371">n</text><text x="112" y="371">0</text><text x="159" y="371">1</text><text x="206" y="371">2</text><text x="253" y="371">3</text><text x="300" y="371">4</text><text x="347" y="371">5</text><text x="394" y="371">6</text><text x="441" y="371">7</text><text x="488" y="371">8</text><text x="535" y="371">9</text><text x="65" y="409">f(n)</text><text x="112" y="409">1</text><text x="159" y="409">1</text><text x="206" y="409">2</text><text x="253" y="409">4</text><text x="300" y="409">7</text><text x="347" y="409">13</text><text x="394" y="409">24</text><text x="441" y="409">44</text><text x="488" y="409">81</text><text x="535" y="409">149</text></g><rect x="190" y="448" width="220" height="34" rx="17" fill="#245276" stroke="#73B6E6" stroke-width="1.2"/><text x="300" y="465" fill="#EAF1FA" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round">f(10) = 274</text></svg>