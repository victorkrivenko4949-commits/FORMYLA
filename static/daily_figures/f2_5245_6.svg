<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500"><rect x="0" y="0" width="600" height="500" fill="#0F1729"/><g font-family="Arial, Helvetica, sans-serif" fill="#EAF1FA" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round"><text x="300" y="42" font-size="18">Разбиения полоски 1×10</text><text x="300" y="68" font-size="12">Каждый вариант задаётся упорядоченной последовательностью частей 1 и 2</text></g><g stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"><rect x="70" y="100" width="460" height="54" fill="#1B2942"/><line x1="162" y1="100" x2="162" y2="154"/><line x1="208" y1="100" x2="208" y2="154"/><line x1="300" y1="100" x2="300" y2="154"/><line x1="392" y1="100" x2="392" y2="154"/><line x1="438" y1="100" x2="438" y2="154"/></g><g fill="#73B6E6" opacity="0.22"><rect x="70" y="100" width="92" height="54"/><rect x="208" y="100" width="92" height="54"/><rect x="300" y="100" width="92" height="54"/><rect x="438" y="100" width="92" height="54"/></g><g font-family="Arial, Helvetica, sans-serif" fill="#EAF1FA" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round"><text x="116" y="127" font-size="14">2</text><text x="185" y="127" font-size="14">1</text><text x="254" y="127" font-size="14">2</text><text x="346" y="127" font-size="14">2</text><text x="415" y="127" font-size="14">1</text><text x="484" y="127" font-size="14">2</text><text x="300" y="174" font-size="12">2 + 1 + 2 + 2 + 1 + 2 = 10</text></g><g stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round"><rect x="70" y="215" width="460" height="54" fill="#1B2942"/><line x1="116" y1="215" x2="116" y2="269"/><line x1="208" y1="215" x2="208" y2="269"/><line x1="254" y1="215" x2="254" y2="269"/><line x1="346" y1="215" x2="346" y2="269"/><line x1="392" y1="215" x2="392" y2="269"/><line x1="438" y1="215" x2="438" y2="269"/></g><g fill="#FFD166" opacity="0.2"><rect x="70" y="215" width="46" height="54"/><rect x="162" y="215" width="46" height="54"/><rect x="254" y="215" width="92" height="54"/><rect x="392" y="215" width="46" height="54"/><rect x="438" y="215" width="92" height="54"/></g><g font-family="Arial, Helvetica, sans-serif" fill="#EAF1FA" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round"><text x="93" y="242" font-size="14">1</text><text x="162" y="242" font-size="14">2</text><text x="231" y="242" font-size="14">1</text><text x="300" y="242" font-size="14">2</text><text x="369" y="242" font-size="14">1</text><text x="415" y="242" font-size="14">1</text><text x="484" y="242" font-size="14">2</text><text x="300" y="289" font-size="12">1 + 2 + 1 + 2 + 1 + 1 + 2 = 10</text><text x="300" y="329" font-size="16">aₙ = aₙ₋₁ + aₙ₋₂</text><text x="300" y="356" font-size="12">первая часть имеет длину 1 или 2</text></g><g stroke="#D9E5F5" stroke-width="1.8" stroke-linecap="round" fill="#1B2942"><rect x="70" y="390" width="460" height="62" rx="4"/><line x1="70" y1="421" x2="530" y2="421"/><line x1="112" y1="390" x2="112" y2="452"/><line x1="154" y1="390" x2="154" y2="452"/><line x1="196" y1="390" x2="196" y2="452"/><line x1="238" y1="390" x2="238" y2="452"/><line x1="280" y1="390" x2="280" y2="452"/><line x1="322" y1="390" x2="322" y2="452"/><line x1="364" y1="390" x2="364" y2="452"/><line x1="406" y1="390" x2="406" y2="452"/><line x1="448" y1="390" x2="448" y2="452"/><line x1="490" y1="390" x2="490" y2="452"/></g><g font-family="Arial, Helvetica, sans-serif" fill="#EAF1FA" text-anchor="middle" dominant-baseline="central" paint-order="stroke fill" stroke="#0F1729" stroke-width="2" stroke-linejoin="round"><text x="91" y="406" font-size="12">n</text><text x="133" y="406" font-size="12">0</text><text x="175" y="406" font-size="12">1</text><text x="217" y="406" font-size="12">2</text><text x="259" y="406" font-size="12">3</text><text x="301" y="406" font-size="12">4</text><text x="343" y="406" font-size="12">5</text><text x="385" y="406" font-size="12">6</text><text x="427" y="406" font-size="12">7</text><text x="469" y="406" font-size="12">8</text><text x="511" y="406" font-size="12">9</text><text x="91" y="437" font-size="12">aₙ</text><text x="133" y="437" font-size="12">1</text><text x="175" y="437" font-size="12">1</text><text x="217" y="437" font-size="12">2</text><text x="259" y="437" font-size="12">3</text><text x="301" y="437" font-size="12">5</text><text x="343" y="437" font-size="12">8</text><text x="385" y="437" font-size="12">13</text><text x="427" y="437" font-size="12">21</text><text x="469" y="437" font-size="12">34</text><text x="511" y="437" font-size="12">55</text><text x="300" y="478" font-size="18">a₁₀ = 55 + 34 = 89</text></g></svg>