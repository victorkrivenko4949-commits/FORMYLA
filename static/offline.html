<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>FORMYLA.net — нет соединения</title>
<style>
  html,body{height:100%;margin:0;background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
  .logo{font-style:italic;font-weight:800;font-size:28px;letter-spacing:2px;margin-bottom:24px;color:#fff}
  .logo span{background:linear-gradient(135deg,#38ef7d,#11998e);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-size:22px;margin:0 0 8px}
  p{color:#94a3b8;margin:0 0 24px;max-width:360px;line-height:1.5}
  button{padding:12px 28px;border:none;border-radius:10px;font-size:16px;font-weight:600;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,#38bdf8,#6366f1);box-shadow:0 2px 12px rgba(56,189,248,.35)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">FORMYLA<span>.net</span></div>
  <h1>📡 Нет соединения с интернетом</h1>
  <p>Проверьте Wi‑Fi или мобильную сеть. Как только связь появится, страница откроется.</p>
  <button onclick="location.reload()">Попробовать снова</button>
</div>
<script>window.addEventListener('online',function(){location.reload();});</script>
</body>
</html>
